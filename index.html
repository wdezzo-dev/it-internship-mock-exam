==` and `.equals()` in Java?",options:["No difference","`==` compares references; `.equals()` compares values","`.equals()` compares references; `==` compares values","`==` is for numbers, `.equals()` is for strings"],correctAnswer:1,explanation:"`==` compares object references (memory addresses), while `.equals()` compares the actual content/values of objects."},{id:"java-7",question:"What is an interface in Java?",options:["A user interface","A contract that defines methods a class must implement","A type of class","A graphical component"],correctAnswer:1,explanation:"An interface is a contract that defines abstract methods that implementing classes must provide."},{id:"java-8",question:"What is the difference between an abstract class and an interface?",options:["No difference","Abstract classes can have method implementations; interfaces traditionally cannot (before Java 8)","Interfaces can have constructors","Abstract classes support multiple inheritance"],correctAnswer:1,explanation:"Abstract classes can have implemented methods and constructors. Interfaces define contracts (before Java 8, only abstract methods)."},{id:"java-9",question:"What is a constructor in Java?",options:["A method that destroys objects","A special method called when an object is created to initialize it","A static method","A method that returns a value"],correctAnswer:1,explanation:"A constructor is a special method with the same name as the class, called when an object is created to initialize its state."},{id:"java-10",question:"What is the `final` keyword used for in Java?",options:["Ending a program","Making variables constant, methods non-overridable, and classes non-inheritable","Finalizing objects","Cleaning up resources"],correctAnswer:1,explanation:"`final` makes variables immutable, prevents method overriding, and prevents class inheritance."},{id:"java-11",question:"What is the difference between `ArrayList` and `LinkedList`?",options:["No difference","ArrayList uses dynamic array (fast access); LinkedList uses doubly-linked list (fast insert/delete)","LinkedList is faster for everything","ArrayList cannot grow in size"],correctAnswer:1,explanation:"ArrayList provides fast random access (O(1)) but slow insertion/deletion. LinkedList provides fast insertion/deletion but slow access."},{id:"java-12",question:"What is method overloading?",options:["Calling a method too many times","Defining multiple methods with the same name but different parameters","Overriding a parent method","Making a method do too much"],correctAnswer:1,explanation:"Method overloading is defining multiple methods with the same name but different parameter lists (number, type, or order)."},{id:"java-13",question:"What is method overriding?",options:["Same as overloading","Providing a specific implementation of a method in a subclass that is already defined in its parent class","Removing a method","Adding parameters to a method"],correctAnswer:1,explanation:"Method overriding allows a subclass to provide a specific implementation of a method already defined in its parent class."},{id:"java-14",question:"What is the `static` keyword in Java?",options:["Makes variables unchangeable","Indicates a member belongs to the class rather than instances","Makes methods faster","Creates static web pages"],correctAnswer:1,explanation:"`static` means the member belongs to the class itself, not to any specific instance. It can be accessed without creating an object."},{id:"java-15",question:"What is exception handling in Java?",options:["Preventing all errors","A mechanism to handle runtime errors using try-catch-finally blocks","A debugging tool","A logging framework"],correctAnswer:1,explanation:"Exception handling uses try-catch-finally blocks to handle runtime errors gracefully without crashing the program."},{id:"java-16",question:"What is the difference between checked and unchecked exceptions?",options:["No difference","Checked exceptions must be handled at compile time; unchecked occur at runtime","Unchecked exceptions must be handled at compile time","Checked exceptions are less severe"],correctAnswer:1,explanation:"Checked exceptions (IOException) must be handled or declared. Unchecked exceptions (RuntimeException) don't require explicit handling."},{id:"java-17",question:"What is a HashMap in Java?",options:["A sorted map","A data structure that stores key-value pairs with O(1) average lookup","A type of list","A thread-safe map"],correctAnswer:1,explanation:"HashMap is a hash table implementation of the Map interface that stores key-value pairs with constant-time average operations."},{id:"java-18",question:"What is the `this` keyword in Java?",options:["Refers to the parent class","Refers to the current object instance","Creates a new object","Refers to the main method"],correctAnswer:1,explanation:"`this` refers to the current object instance. It's used to distinguish instance variables from parameters with the same name."},{id:"java-19",question:"What is garbage collection in Java?",options:["Deleting files","Automatic memory management that reclaims memory from unused objects","Cleaning up code","Removing unused imports"],correctAnswer:1,explanation:"Garbage collection is Java's automatic memory management process that identifies and frees memory occupied by unreferenced objects."},{id:"java-20",question:"What is the `super` keyword used for?",options:["Making a method better","Referring to the parent class's members and constructor","Creating superclasses","Accessing static methods"],correctAnswer:1,explanation:"`super` refers to the parent class. It's used to call the parent's constructor, methods, or access parent's fields."},{id:"java-21",question:"What are generics in Java?",options:["Generic methods without specific behavior","Type parameters that allow classes and methods to work with different types safely","A type of variable","A design pattern"],correctAnswer:1,explanation:"Generics enable type parameterization, allowing classes/methods to work with different types while maintaining type safety at compile time."},{id:"java-22",question:"What is the Collections Framework in Java?",options:["A set of collection classes only","A unified architecture of interfaces and classes for storing and manipulating groups of objects","A database framework","A web framework"],correctAnswer:1,explanation:"The Collections Framework provides a unified architecture of interfaces (List, Set, Map) and implementations for data structures."},{id:"java-23",question:"What is multithreading in Java?",options:["Running multiple programs","Executing multiple threads concurrently within a single program","Using multiple processors","Running multiple JVMs"],correctAnswer:1,explanation:"Multithreading allows concurrent execution of two or more threads within a program, enabling parallel task execution."},{id:"java-24",question:"What is the `synchronized` keyword used for?",options:["Synchronizing clocks","Ensuring only one thread can access a block of code or method at a time","Syncing data to disk","Synchronizing databases"],correctAnswer:1,explanation:"`synchronized` ensures that only one thread can execute a block of code or method at a time, preventing race conditions."},{id:"java-25",question:"What is the Stream API in Java?",options:["A file streaming API","A functional-style API for processing sequences of elements with operations like map, filter, reduce","A network streaming API","An audio/video API"],correctAnswer:1,explanation:"The Stream API (Java 8+) provides a functional approach to processing collections with operations like filter, map, and reduce."},{id:"java-26",question:"What is a lambda expression in Java?",options:["A Greek variable","A concise way to represent an anonymous function (functional interface implementation)","A mathematical formula","A type of loop"],correctAnswer:1,explanation:"Lambda expressions provide a concise way to implement functional interfaces using the -> syntax, e.g., (x) -> x * 2."},{id:"java-27",question:"What is the difference between `String`, `StringBuilder`, and `StringBuffer`?",options:["All are the same","String is immutable; StringBuilder is mutable and not thread-safe; StringBuffer is mutable and thread-safe","StringBuilder is immutable","StringBuffer is not thread-safe"],correctAnswer:1,explanation:"String is immutable. StringBuilder is mutable and faster (not synchronized). StringBuffer is mutable and thread-safe (synchronized)."},{id:"java-28",question:"What is an enum in Java?",options:["A number type","A special data type that defines a fixed set of constants","An enumeration loop","A counter variable"],correctAnswer:1,explanation:"An enum is a special data type that defines a set of named constants, like days of the week or compass directions."},{id:"java-29",question:"What is the `Optional` class in Java?",options:["An optional feature","A container that may or may not contain a non-null value, helping avoid NullPointerException","An optional parameter","An optional import"],correctAnswer:1,explanation:"Optional is a container that may or may not hold a value, providing methods to handle null values gracefully."},{id:"java-30",question:"What is JDBC?",options:["Java Database Creator","Java Database Connectivity - an API for connecting to databases","Java Data Binding Component","Java Dynamic Byte Code"],correctAnswer:1,explanation:"JDBC (Java Database Connectivity) is an API that defines how Java applications interact with databases."},{id:"java-31",question:"What is Spring Boot?",options:["A boot loader for Java","A framework that simplifies creating production-ready Spring applications","A startup tool","A testing framework"],correctAnswer:1,explanation:"Spring Boot simplifies the creation of production-ready Spring applications with auto-configuration and embedded servers."},{id:"java-32",question:"What is the Singleton design pattern?",options:["A class with one method","A pattern that ensures a class has only one instance with a global access point","A single variable pattern","A one-time use class"],correctAnswer:1,explanation:"Singleton ensures that a class has only one instance and provides a global point of access to it."},{id:"java-33",question:"What is dependency injection?",options:["Adding dependencies to pom.xml","A technique where objects receive their dependencies from external sources rather than creating them","Injecting code at runtime","A security vulnerability"],correctAnswer:1,explanation:"Dependency injection is a technique where objects receive their dependencies from external sources, promoting loose coupling."},{id:"java-34",question:"What is the difference between `Comparable` and `Comparator`?",options:["No difference","Comparable defines natural ordering within the class; Comparator defines external custom ordering","Comparator is built-in; Comparable is external","Comparable is for strings only"],correctAnswer:1,explanation:"Comparable defines natural ordering (compareTo in the class itself). Comparator defines custom external ordering (compare method)."},{id:"java-35",question:"What is autoboxing in Java?",options:["Automatic packaging","Automatic conversion between primitive types and their wrapper classes","Automatically creating objects","Compressing data"],correctAnswer:1,explanation:"Autoboxing is the automatic conversion between primitive types (int) and their wrapper classes (Integer) by the compiler."},{id:"java-36",question:"What are annotations in Java?",options:["Code comments","Metadata that provides data about the program but isn't part of the program itself","Variable labels","Error messages"],correctAnswer:1,explanation:"Annotations are metadata markers (like @Override, @Deprecated) that provide information to the compiler and runtime."},{id:"java-37",question:"What is the `volatile` keyword in Java?",options:["Makes variables dangerous","Ensures a variable's value is always read from main memory, not cached by threads","Makes variables temporary","Deletes variables after use"],correctAnswer:1,explanation:"`volatile` ensures that a variable is always read from and written to main memory, guaranteeing visibility across threads."},{id:"java-38",question:"What is the Factory design pattern?",options:["A manufacturing system","A pattern that provides an interface for creating objects without specifying their exact class","A code generator","A build tool"],correctAnswer:1,explanation:"Factory pattern provides an interface for creating objects without specifying the exact class, delegating instantiation to subclasses."},{id:"java-39",question:"What is Maven in Java?",options:["A Java IDE","A build automation and dependency management tool","A testing framework","A web server"],correctAnswer:1,explanation:"Maven is a build automation tool that manages project dependencies, compilation, testing, and packaging using a pom.xml file."},{id:"java-40",question:"What is the `try-with-resources` statement?",options:["Trying to access resources","Automatically closes resources (like streams) when the try block finishes","Retrying failed operations","Loading resources from files"],correctAnswer:1,explanation:"Try-with-resources automatically closes resources that implement AutoCloseable when the try block exits, preventing resource leaks."},{id:"java-41",question:"What is polymorphism in Java?",options:["Having multiple classes","The ability of an object to take many forms, typically through inheritance","Creating multiple objects","Using multiple data types"],correctAnswer:1,explanation:"Polymorphism allows objects to be treated as instances of their parent class, with the actual method being determined at runtime."},{id:"java-42",question:"What is encapsulation in Java?",options:["Wrapping code in comments","Bundling data and methods together and restricting direct access to internal state","Creating capsule-shaped objects","Compressing code"],correctAnswer:1,explanation:"Encapsulation bundles data (fields) and methods that operate on that data, restricting direct access via access modifiers."},{id:"java-43",question:"What are access modifiers in Java?",options:["File permissions","Keywords (public, private, protected, default) that control access to classes, methods, and variables","User authentication methods","Database access controls"],correctAnswer:1,explanation:"Access modifiers (public, private, protected, package-private) control the visibility and accessibility of classes, methods, and fields."},{id:"java-44",question:"What is the Observer design pattern?",options:["Monitoring system performance","A pattern where an object notifies its dependents of state changes","Debugging code","Watching variables"],correctAnswer:1,explanation:"Observer pattern defines a one-to-many dependency where when one object changes state, all its dependents are notified."},{id:"java-45",question:"What is the difference between `HashSet` and `TreeSet`?",options:["No difference","HashSet is unordered with O(1) operations; TreeSet is sorted with O(log n) operations","TreeSet is faster","HashSet maintains insertion order"],correctAnswer:1,explanation:"HashSet is unordered with constant-time operations. TreeSet maintains elements in sorted order with logarithmic-time operations."},{id:"java-46",question:"What is JUnit used for?",options:["Building user interfaces","Unit testing Java applications","Managing dependencies","Deploying applications"],correctAnswer:1,explanation:"JUnit is the most widely used testing framework for Java, providing annotations and assertions for writing unit tests."},{id:"java-47",question:"What is the `transient` keyword?",options:["A temporary variable","Prevents a field from being serialized","Makes a variable change constantly","A type of modifier"],correctAnswer:1,explanation:"`transient` marks a field to be excluded during serialization, so it won't be saved when the object is serialized."},{id:"java-48",question:"What is a functional interface in Java?",options:["An interface with many methods","An interface with exactly one abstract method, usable with lambda expressions","An interface for functions only","A deprecated interface type"],correctAnswer:1,explanation:"A functional interface has exactly one abstract method and can be used as the target for lambda expressions (e.g., Runnable, Comparator)."},{id:"java-49",question:"What is the `var` keyword in Java (10+)?",options:["Same as JavaScript var","Local variable type inference that lets the compiler determine the type","A global variable declaration","A mutable variable"],correctAnswer:1,explanation:"`var` (Java 10+) enables local variable type inference, allowing the compiler to infer the type from the assigned value."},{id:"java-50",question:"What is the MVC (Model-View-Controller) pattern?",options:["A Java-specific pattern","An architectural pattern separating data (Model), UI (View), and logic (Controller)","A testing pattern","A database pattern"],correctAnswer:1,explanation:"MVC separates an application into Model (data/logic), View (UI/presentation), and Controller (handles input and updates model)."}],yh=[{id:"cloud-1",question:"What is cloud computing?",options:["Storing files on a USB drive","Delivering computing services over the internet on-demand","Using a local server","A type of weather technology"],correctAnswer:1,explanation:"Cloud computing delivers computing services (servers, storage, databases, networking) over the internet on a pay-as-you-go basis."},{id:"cloud-2",question:"What are the three main cloud service models?",options:["HTML, CSS, JavaScript","IaaS, PaaS, SaaS","CPU, RAM, Storage","Linux, Windows, macOS"],correctAnswer:1,explanation:"IaaS (Infrastructure), PaaS (Platform), and SaaS (Software) are the three main cloud service models."},{id:"cloud-3",question:"What is AWS?",options:["A programming language","Amazon Web Services - a comprehensive cloud platform","A web framework","An operating system"],correctAnswer:1,explanation:"AWS (Amazon Web Services) is the world's most comprehensive cloud platform, offering over 200 services."},{id:"cloud-4",question:"What is a Virtual Machine (VM)?",options:["A physical server","A software emulation of a computer system that runs on a host machine","A programming language","A type of database"],correctAnswer:1,explanation:"A VM is a software-based emulation of a computer that runs an operating system and applications like a physical computer."},{id:"cloud-5",question:"What is Docker?",options:["A cloud provider","A platform for building, shipping, and running applications in containers","A programming language","A database"],correctAnswer:1,explanation:"Docker is a platform that uses containers to package applications with all dependencies for consistent deployment."},{id:"cloud-6",question:"What is the difference between a container and a VM?",options:["No difference","Containers share the host OS kernel and are lighter; VMs include a full OS","VMs are lighter than containers","Containers require more resources"],correctAnswer:1,explanation:"Containers share the host OS kernel, making them lightweight and fast. VMs include a full OS, providing stronger isolation but using more resources."},{id:"cloud-7",question:"What is Kubernetes (K8s)?",options:["A programming language","An open-source container orchestration platform for automating deployment and scaling","A cloud provider","A database system"],correctAnswer:1,explanation:"Kubernetes is an open-source platform for automating deployment, scaling, and management of containerized applications."},{id:"cloud-8",question:"What is serverless computing?",options:["Computing without any servers","A model where the cloud provider manages servers and you only pay for execution time","Client-side computing only","Computing without internet"],correctAnswer:1,explanation:"Serverless computing lets you build and run code without managing servers. The provider automatically handles infrastructure."},{id:"cloud-9",question:"What is AWS Lambda?",options:["A lambda calculus tool","A serverless compute service that runs code in response to events","A programming language","A database service"],correctAnswer:1,explanation:"AWS Lambda is a serverless compute service that runs code in response to events without provisioning or managing servers."},{id:"cloud-10",question:"What is Amazon S3?",options:["A compute service","A scalable object storage service","A database service","A networking service"],correctAnswer:1,explanation:"Amazon S3 (Simple Storage Service) provides scalable object storage for data backup, archival, and application hosting."},{id:"cloud-11",question:"What is a load balancer?",options:["A power supply unit","A device/service that distributes incoming traffic across multiple servers","A weight measurement tool","A data compression tool"],correctAnswer:1,explanation:"A load balancer distributes incoming network traffic across multiple servers to ensure no single server is overwhelmed."},{id:"cloud-12",question:"What is auto-scaling?",options:["Manually adding servers","Automatically adjusting computing resources based on demand","Scaling image sizes","A CSS feature"],correctAnswer:1,explanation:"Auto-scaling automatically adjusts the number of computing resources based on current demand, scaling up or down as needed."},{id:"cloud-13",question:"What is a CDN (Content Delivery Network)?",options:["A programming network","A distributed network of servers that delivers content from the closest location to users","A social network","A database network"],correctAnswer:1,explanation:"A CDN is a geographically distributed network of servers that delivers web content to users from the nearest server location."},{id:"cloud-14",question:"What are the three cloud deployment models?",options:["Small, Medium, Large","Public, Private, Hybrid","Local, Remote, Mixed","Free, Paid, Enterprise"],correctAnswer:1,explanation:"Public cloud (shared), Private cloud (dedicated), and Hybrid cloud (combination of both) are the three deployment models."},{id:"cloud-15",question:"What is CI/CD?",options:["Computer Interface/Computer Design","Continuous Integration/Continuous Deployment - automating code integration and deployment","Cloud Integration/Cloud Deployment","Code Inspection/Code Delivery"],correctAnswer:1,explanation:"CI/CD automates code integration (building, testing) and deployment, enabling frequent, reliable software releases."},{id:"cloud-16",question:"What is Infrastructure as Code (IaC)?",options:["Writing code on infrastructure","Managing and provisioning infrastructure through code/configuration files instead of manual processes","Coding infrastructure software","A coding bootcamp"],correctAnswer:1,explanation:"IaC manages infrastructure through machine-readable configuration files, enabling version control and automation (e.g., Terraform)."},{id:"cloud-17",question:"What is Amazon EC2?",options:["A storage service","A scalable virtual server (compute) service in the AWS cloud","A database service","A messaging service"],correctAnswer:1,explanation:"EC2 (Elastic Compute Cloud) provides resizable virtual servers in the cloud, allowing you to scale compute capacity."},{id:"cloud-18",question:"What is Azure?",options:["A programming language","Microsoft's cloud computing platform","A database system","An operating system"],correctAnswer:1,explanation:"Microsoft Azure is a cloud computing platform offering services for computing, analytics, storage, and networking."},{id:"cloud-19",question:"What is Google Cloud Platform (GCP)?",options:["A search engine","Google's suite of cloud computing services","A web browser","An email service"],correctAnswer:1,explanation:"GCP is Google's suite of cloud computing services, offering compute, storage, big data, machine learning, and more."},{id:"cloud-20",question:"What is a microservices architecture?",options:["Using very small servers","An approach where an application is composed of small, independent, loosely coupled services","Micro-sized applications","A miniature computing model"],correctAnswer:1,explanation:"Microservices architecture structures an application as a collection of small, independent services that communicate via APIs."},{id:"cloud-21",question:"What is DevOps?",options:["A programming language","A culture and set of practices combining development and operations for faster delivery","A type of server","A cloud provider"],correctAnswer:1,explanation:"DevOps combines software development (Dev) and IT operations (Ops) to shorten the development lifecycle and deliver continuously."},{id:"cloud-22",question:"What is a VPC (Virtual Private Cloud)?",options:["A VPN connection","An isolated virtual network within a cloud provider where you control networking","A virtual PC","A private computer"],correctAnswer:1,explanation:"A VPC is a logically isolated virtual network within a cloud provider where you define IP ranges, subnets, and security rules."},{id:"cloud-23",question:"What is Terraform?",options:["A planet modification tool","An Infrastructure as Code tool for provisioning cloud resources","A testing framework","A monitoring tool"],correctAnswer:1,explanation:"Terraform is an open-source IaC tool by HashiCorp that lets you define and provision cloud infrastructure using declarative configuration."},{id:"cloud-24",question:"What is a container registry?",options:["A shipping container tracker","A storage service for container images (like Docker Hub or ECR)","A container management tool","A container orchestrator"],correctAnswer:1,explanation:"A container registry stores and distributes container images. Examples include Docker Hub, AWS ECR, and Google Container Registry."},{id:"cloud-25",question:"What is cloud-native?",options:["Born in the cloud","An approach to building applications that fully exploit cloud computing advantages","Using only cloud storage","A cloud certification"],correctAnswer:1,explanation:"Cloud-native is an approach to building applications that fully leverage cloud computing with containers, microservices, and CI/CD."},{id:"cloud-26",question:"What is Amazon RDS?",options:["A compute service","A managed relational database service","A storage service","A networking service"],correctAnswer:1,explanation:"Amazon RDS (Relational Database Service) is a managed service for relational databases like MySQL, PostgreSQL, and Oracle."},{id:"cloud-27",question:"What is the difference between vertical and horizontal scaling?",options:["No difference","Vertical adds more power to existing server; horizontal adds more servers","Horizontal adds power; vertical adds servers","Vertical is cheaper"],correctAnswer:1,explanation:"Vertical scaling (scale up) increases resources of a single server. Horizontal scaling (scale out) adds more server instances."},{id:"cloud-28",question:"What is a DNS (Domain Name System)?",options:["A type of database","A system that translates domain names to IP addresses","A security protocol","A data network system"],correctAnswer:1,explanation:"DNS translates human-readable domain names (e.g., google.com) into IP addresses that computers use to communicate."},{id:"cloud-29",question:"What is an API Gateway?",options:["A physical gateway","A service that acts as a single entry point for a set of microservices/APIs","An API documentation tool","A programming interface"],correctAnswer:1,explanation:"An API Gateway acts as a single entry point for API requests, handling routing, authentication, rate limiting, and monitoring."},{id:"cloud-30",question:"What is cloud storage?",options:["A USB flash drive","A service that stores data on remote servers accessible via the internet","A local hard drive","RAM storage"],correctAnswer:1,explanation:"Cloud storage stores data on remote servers maintained by a cloud provider, accessible over the internet from anywhere."},{id:"cloud-31",question:"What is a Dockerfile?",options:["A documentation file","A text file with instructions to build a Docker container image","A Docker configuration file","A log file"],correctAnswer:1,explanation:"A Dockerfile is a text document containing all the commands/instructions needed to build a Docker container image."},{id:"cloud-32",question:"What is AWS IAM?",options:["An instant messaging service","Identity and Access Management - controls who can access AWS resources","An AI service","A monitoring tool"],correctAnswer:1,explanation:"AWS IAM (Identity and Access Management) lets you manage access to AWS resources by creating users, groups, and permission policies."},{id:"cloud-33",question:"What is a container pod in Kubernetes?",options:["A group of dolphins","The smallest deployable unit containing one or more containers that share resources","A storage unit","A network node"],correctAnswer:1,explanation:"A pod is the smallest deployable unit in Kubernetes, containing one or more containers that share storage and networking."},{id:"cloud-34",question:"What is elasticity in cloud computing?",options:["Flexible pricing","The ability to automatically scale resources up or down based on demand","Stretchable storage","Flexible deployment"],correctAnswer:1,explanation:"Elasticity is the ability to automatically provision and deprovision resources to match the current demand."},{id:"cloud-35",question:"What is a reverse proxy?",options:["A proxy that goes backwards","A server that sits in front of web servers, forwarding client requests to backend servers","An inverted firewall","A client-side proxy"],correctAnswer:1,explanation:"A reverse proxy sits in front of backend servers, forwarding client requests, providing load balancing, SSL termination, and caching."},{id:"cloud-36",question:"What is AWS CloudFormation?",options:["A weather service","An IaC service that lets you model and provision AWS resources using templates","A cloud monitoring tool","A data migration tool"],correctAnswer:1,explanation:"CloudFormation lets you model and provision AWS resources using JSON/YAML templates, implementing Infrastructure as Code."},{id:"cloud-37",question:"What is a NoSQL database?",options:["A database without SQL support","A non-relational database designed for flexible schemas and horizontal scaling","A SQL replacement","A file-based database"],correctAnswer:1,explanation:"NoSQL databases are non-relational, designed for flexible schemas, horizontal scaling, and specific data models (document, key-value, graph)."},{id:"cloud-38",question:"What is Redis?",options:["A programming language","An in-memory data store used as a cache, message broker, and database","A cloud provider","A web framework"],correctAnswer:1,explanation:"Redis is an open-source, in-memory data structure store used as a database, cache, message broker, and streaming engine."},{id:"cloud-39",question:"What is monitoring in cloud operations?",options:["Watching security cameras","Tracking the health, performance, and availability of cloud resources and applications","Reading logs manually","Checking emails"],correctAnswer:1,explanation:"Cloud monitoring involves tracking metrics, logs, and health of cloud resources to ensure performance and availability."},{id:"cloud-40",question:"What is a Service Level Agreement (SLA)?",options:["A software license","A commitment between a service provider and client defining expected service levels","A service learning activity","A security level assessment"],correctAnswer:1,explanation:"An SLA is a formal agreement defining the expected level of service, including uptime guarantees and performance metrics."},{id:"cloud-41",question:"What is multi-tenancy?",options:["Multiple tenants in a building","A single instance of software serving multiple customers (tenants)","Running multiple applications","Using multiple clouds"],correctAnswer:1,explanation:"Multi-tenancy is an architecture where a single instance of software serves multiple customers, each with isolated data."},{id:"cloud-42",question:"What is object storage?",options:["Storing physical objects","A storage architecture that manages data as objects with metadata and unique IDs","A database type","File system storage"],correctAnswer:1,explanation:"Object storage manages data as objects (with metadata and unique IDs) rather than files in a hierarchy. S3 is a common example."},{id:"cloud-43",question:"What is a message queue?",options:["An email inbox","A service that enables asynchronous communication between application components","A chat application","A notification system"],correctAnswer:1,explanation:"A message queue enables asynchronous communication between services by storing messages until they are processed (e.g., SQS, RabbitMQ)."},{id:"cloud-44",question:"What is blue-green deployment?",options:["Color-coded servers","A strategy with two identical environments where traffic is switched from old (blue) to new (green)","Environmental computing","A monitoring dashboard"],correctAnswer:1,explanation:"Blue-green deployment maintains two identical environments. Traffic is switched from the current (blue) to the new (green) release."},{id:"cloud-45",question:"What is cloud security?",options:["Physical security of data centers","A set of policies, technologies, and controls to protect cloud-based systems and data","Antivirus for cloud","Password management"],correctAnswer:1,explanation:"Cloud security encompasses policies, technologies, and controls that protect cloud infrastructure, data, and applications."},{id:"cloud-46",question:"What is a container image?",options:["A picture of a container","A lightweight, standalone package containing everything needed to run an application","A screenshot","A backup file"],correctAnswer:1,explanation:"A container image is a lightweight, immutable package containing application code, runtime, libraries, and dependencies."},{id:"cloud-47",question:"What is AWS CloudWatch?",options:["A clock service","A monitoring and observability service for AWS resources and applications","A security service","A deployment tool"],correctAnswer:1,explanation:"CloudWatch monitors AWS resources and applications, collecting metrics, logs, and setting alarms."},{id:"cloud-48",question:"What is the shared responsibility model?",options:["Sharing costs between teams","Cloud provider secures infrastructure; customer secures their data and applications","All responsibility is on the customer","All responsibility is on the provider"],correctAnswer:1,explanation:"The shared responsibility model divides security: the provider secures the cloud infrastructure, the customer secures what they put in it."},{id:"cloud-49",question:"What is a region in cloud computing?",options:["A geographic area on a map","A geographic area containing multiple data centers (availability zones)","A network segment","A department in a company"],correctAnswer:1,explanation:"A cloud region is a geographic area containing multiple isolated data centers (availability zones) for redundancy and low latency."},{id:"cloud-50",question:"What is GitOps?",options:["A Git hosting service","Using Git as the single source of truth for declarative infrastructure and application deployment","A Git plugin","A version control system"],correctAnswer:1,explanation:"GitOps uses Git repositories as the source of truth for infrastructure and application definitions, with automated deployment."}],vh=[{id:"ai-1",question:"What is Artificial Intelligence (AI)?",options:["A robot","The simulation of human intelligence by computer systems","A programming language","A database technology"],correctAnswer:1,explanation:"AI is the simulation of human intelligence processes by computer systems, including learning, reasoning, and self-correction."},{id:"ai-2",question:"What is Machine Learning (ML)?",options:["Teaching machines to type","A subset of AI where systems learn from data without being explicitly programmed","A programming technique","A hardware component"],correctAnswer:1,explanation:"ML is a subset of AI focused on building systems that learn from data to improve their performance on tasks without explicit programming."},{id:"ai-3",question:"What is the difference between supervised and unsupervised learning?",options:["No difference","Supervised uses labeled data; unsupervised finds patterns in unlabeled data","Unsupervised uses labeled data","Supervised doesn't use any data"],correctAnswer:1,explanation:"Supervised learning trains on labeled data (input-output pairs). Unsupervised learning finds patterns in data without labels."},{id:"ai-4",question:"What is a neural network?",options:["A computer network","A computing system inspired by biological neural networks with layers of connected nodes","A social network","A mesh network"],correctAnswer:1,explanation:"A neural network is a computing system inspired by biological brains, consisting of layers of interconnected nodes (neurons)."},{id:"ai-5",question:"What is deep learning?",options:["Learning deeply about a subject","A subset of ML using neural networks with many layers to learn complex patterns","Advanced programming","Deep data analysis"],correctAnswer:1,explanation:"Deep learning uses neural networks with many layers (deep networks) to learn hierarchical representations from large amounts of data."},{id:"ai-6",question:"What is Natural Language Processing (NLP)?",options:["Programming in natural language","AI's ability to understand, interpret, and generate human language","A natural programming language","Language translation software"],correctAnswer:1,explanation:"NLP is a branch of AI focused on the interaction between computers and human language, enabling machines to understand text and speech."},{id:"ai-7",question:"What is a training dataset?",options:["A fitness app dataset","A labeled set of data used to teach a machine learning model","A database backup","A test environment"],correctAnswer:1,explanation:"A training dataset is a set of data used to teach a ML model to recognize patterns and make pre access to internal services","Forward planning","Email forwarding"],correctAnswer:1,explanation:"Port forwarding redirects incoming traffic from a specific port on a router to a specific device/port on the internal network."},{id:"itops-40",question:"What is the purpose of a UPS (Uninterruptible Power Supply)?",options:["A delivery service","Providing emergency power to equipment when the main power source fails","Upgrading power supplies","Universal power standard"],correctAnswer:1,explanation:"A UPS provides emergency backup power to connected equipment during power outages, preventing data loss and hardware damage."},{id:"itops-41",question:"What is the principle of least privilege?",options:["Giving everyone admin access","Granting users only the minimum access rights needed to perform their job","Restricting all access","Using guest accounts"],correctAnswer:1,explanation:"The principle of least privilege grants users only the minimum access rights necessary to perform their duties, limiting security risk."},{id:"itops-42",question:"What is an incident in ITIL?",options:["A security breach","An unplanned interruption to a service or reduction in quality of service","A planned change","A software update"],correctAnswer:1,explanation:"In ITIL, an incident is an unplanned interruption to an IT service or a reduction in the quality of an IT service."},{id:"itops-43",question:"What is a change management process?",options:["Changing management","A systematic approach to managing all changes to IT infrastructure to minimize disruption","Changing passwords","Software updates"],correctAnswer:1,explanation:"Change management controls the lifecycle of all IT changes, minimizing disruption and ensuring changes are implemented smoothly."},{id:"itops-44",question:"What is a SAN (Storage Area Network)?",options:["A social area network","A high-speed network providing block-level access to consolidated data storage","A small area network","A secure access network"],correctAnswer:1,explanation:"A SAN is a dedicated high-speed network that provides block-level access to consolidated, centralized data storage."},{id:"itops-45",question:"What is virtualization?",options:["Virtual reality","Creating virtual versions of physical resources (servers, storage, networks)","Making things invisible","Online gaming"],correctAnswer:1,explanation:"Virtualization creates virtual versions of physical resources, allowing multiple virtual systems to run on a single physical system."},{id:"itops-46",question:"What is Nginx?",options:["A programming language","A high-performance web server, reverse proxy, and load balancer","A database","A monitoring tool"],correctAnswer:1,explanation:"Nginx is a high-performance web server that also serves as a reverse proxy, load balancer, and HTTP cache."},{id:"itops-47",question:"What is the 3-2-1 backup rule?",options:["Backup 3 times daily, 2 weekly, 1 monthly","3 copies of data, on 2 different media types, with 1 copy offsite","3 full, 2 incremental, 1 differential backups","Backup at 3am, 2pm, and 1am"],correctAnswer:1,explanation:"The 3-2-1 rule: keep 3 copies of data, on 2 different types of media, with 1 copy stored offsite for disaster recovery."},{id:"itops-48",question:"What is SNMP?",options:["Simple Network Management Protocol - used to monitor and manage network devices","Secure Network Message Protocol","System Network Monitoring Program","Simple Network Mail Protocol"],correctAnswer:0,explanation:"SNMP (Simple Network Management Protocol) is used to collect and organize information about managed devices on networks."},{id:"itops-49",question:"What is a runbook?",options:["A running diary","A set of standardized procedures for routine IT operations and incident response","A coding exercise book","A project plan"],correctAnswer:1,explanation:"A runbook is a compilation of routine procedures and operations that system administrators or operators carry out."},{id:"itops-50",question:"What is high availability (HA)?",options:["Having fast internet","Designing systems to be continuously operational with minimal downtime","Having many servers","High-speed computing"],correctAnswer:1,explanation:"High availability refers to systems designed to be continuously operational with minimal downtime, typically 99.9%+ uptime."}],wh=[{id:"agile-1",question:"What is Agile methodology?",options:["A waterfall approach","An iterative approach to project management and software development emphasizing flexibility","A documentation standard","A testing framework"],correctAnswer:1,explanation:"Agile is an iterative approach to software development that delivers work in small increments, emphasizing collaboration and adaptability."},{id:"agile-2",question:"What is Scrum?",options:["A rugby term only","An Agile framework for managing work with sprints, roles, and ceremonies","A programming language","A testing method"],correctAnswer:1,explanation:"Scrum is an Agile framework that uses sprints (fixed-length iterations), defined roles, and ceremonies to deliver software incrementally."},{id:"agile-3",question:"What is a Sprint in Scrum?",options:["Running fast","A fixed time period (1-4 weeks) during which a specific set of work is completed","A type of meeting","A deployment process"],correctAnswer:1,explanation:"A Sprint is a time-boxed iteration (typically 1-4 weeks) during which the team works on a set of planned user stories."},{id:"agile-4",question:"What are the three roles in Scrum?",options:["Manager, Developer, Tester","Product Owner, Scrum Master, Development Team","Designer, Developer, DevOps","Lead, Senior, Junior"],correctAnswer:1,explanation:"The three Scrum roles are Product Owner (what to build), Scrum Master (process facilitator), and Development Team (builders)."},{id:"agile-5",question:"What is the Product Backlog?",options:["A list of bugs","An ordered list of all desired work/features for the product","A deployment checklist","A code review list"],correctAnswer:1,explanation:"The Product Backlog is a prioritized list of all features, enhancements, and fixes that constitute the requirements for the product."},{id:"agile-6",question:"What is a User Story?",options:["A biography","A short description of a feature from the end user's perspective","A test case","A bug report"],correctAnswer:1,explanation:`A User Story describes a feature from the user's perspective: "As a [user], I want [feature] so that [benefit]."`},{id:"agile-7",question:"What is the Daily Standup (Daily Scrum)?",options:["A long team meeting","A brief daily meeting where team members share progress, plans, and blockers","A code review session","A deployment meeting"],correctAnswer:1,explanation:"The Daily Standup is a brief (15-min) meeting where team members answer: What did I do? What will I do? What blocks me?"},{id:"agile-8",question:"What is Sprint Planning?",options:["Planning a race","A meeting where the team decides what work to complete in the upcoming Sprint","Planning the product roadmap","Planning team vacations"],correctAnswer:1,explanation:"Sprint Planning is a ceremony where the team selects items from the Product Backlog to work on during the Sprint and creates a plan."},{id:"agile-9",question:"What is a Sprint Retrospective?",options:["A code review","A meeting at the end of a Sprint to reflect on what went well and what to improve","A deployment review","A bug triage meeting"],correctAnswer:1,explanation:"The Sprint Retrospective is a meeting where the team reflects on the Sprint to identify improvements for the next Sprint."},{id:"agile-10",question:"What is a Sprint Review?",options:["A performance review","A meeting where the team demonstrates completed work to stakeholders for feedback","A code review","A document review"],correctAnswer:1,explanation:"The Sprint Review is where the team demonstrates completed work to stakeholders and gathers feedback at the end of a Sprint."},{id:"agile-11",question:"What is a Kanban board?",options:["A whiteboard","A visual tool showing work items in columns representing workflow stages","A spreadsheet","A project plan"],correctAnswer:1,explanation:"A Kanban board visualizes work items as cards moving through columns (e.g., To Do, In Progress, Done) representing workflow stages."},{id:"agile-12",question:"What is the Definition of Done (DoD)?",options:["When a developer says it's done","A shared agreement of criteria that must be met before a work item is considered complete","When all bugs are fixed","When the code compiles"],correctAnswer:1,explanation:"The DoD is a shared understanding of what criteria must be met for a user story or task to be considered complete."},{id:"agile-13",question:"What is velocity in Agile?",options:["How fast developers type","The amount of work a team completes during a Sprint, measured in story points","The speed of deployments","Network speed"],correctAnswer:1,explanation:"Velocity is the average amount of work (measured in story points) a team completes per Sprint, used for planning."},{id:"agile-14",question:"What are Story Points?",options:["Points scored in a game","A relative measure of effort, complexity, and uncertainty for a user story","Lines of code","Hours of work"],correctAnswer:1,explanation:"Story Points are a relative unit of measure for estimating the effort, complexity, and uncertainty of a user story."},{id:"agile-15",question:"What is the Agile Manifesto?",options:["A legal document","A declaration of four values and twelve principles for Agile software development","A programming standard","A project plan template"],correctAnswer:1,explanation:"The Agile Manifesto (2001) declares four core values and twelve principles guiding Agile software development."},{id:"agile-16",question:"Which is an Agile Manifesto value?",options:["Documentation over working software","Individuals and interactions over processes and tools","Following a plan over responding to change","Contract negotiation over customer collaboration"],correctAnswer:1,explanation:"The manifesto values: Individuals & interactions, Working software, Customer collaboration, and Responding to change (over their counterparts)."},{id:"agile-17",question:"What is the difference between Scrum and Kanban?",options:["No difference","Scrum uses fixed sprints with roles; Kanban uses continuous flow with WIP limits","Kanban uses sprints","Scrum has no structure"],correctAnswer:1,explanation:"Scrum uses time-boxed sprints with defined roles and ceremonies. Kanban uses continuous flow with work-in-progress (WIP) limits."},{id:"agile-18",question:"What is WIP (Work In Progress) limit?",options:["A word count limit","A constraint on the number of work items in a stage at any time to improve flow","A sprint time limit","A team size limit"],correctAnswer:1,explanation:"WIP limits cap the number of work items allowed in each workflow stage, preventing overload and improving flow and quality."},{id:"agile-19",question:"What is a burndown chart?",options:["A fire chart","A graph showing the amount of work remaining vs. time in a Sprint","A performance chart","A budget chart"],correctAnswer:1,explanation:"A burndown chart graphically shows remaining work versus time, helping the team track progress toward the Sprint goal."},{id:"agile-20",question:"What is pair programming?",options:["Two people sharing a computer","Two developers working together at one workstation, one coding and one reviewing","Programming in pairs of files","Two projects running simultaneously"],correctAnswer:1,explanation:"Pair programming involves two developers working together: one writes code (driver) while the other reviews (navigator)."},{id:"agile-21",question:"What is Test-Driven Development (TDD)?",options:["Testing after development","Writing tests before writing the code that makes them pass","Testing during deployment","Testing in production"],correctAnswer:1,explanation:"TDD is a practice where you write a failing test first, then write the minimum code to pass it, then refactor."},{id:"agile-22",question:"What is Continuous Integration (CI)?",options:["Integrating teams","Frequently merging code changes into a shared repository with automated builds and tests","Continuous meetings","Non-stop coding"],correctAnswer:1,explanation:"CI is the practice of frequently integrating code changes into a shared repository, automatically building and testing each change."},{id:"agile-23",question:"What is Continuous Deployment (CD)?",options:["Deploying continuously without testing","Automatically deploying every code change that passes all tests to production","Continuous documentation","Deploying once a year"],correctAnswer:1,explanation:"Continuous Deployment automatically deploys every change that passes the automated testing pipeline to production."},{id:"agile-24",question:"What is refactoring?",options:["Rewriting everything from scratch","Restructuring existing code without changing its external behavior to improve quality","Adding new features","Fixing bugs"],correctAnswer:1,explanation:"Refactoring improves the internal structure of code without changing its external behavior, making it cleaner and more maintainable."},{id:"agile-25",question:"What is a Product Owner responsible for?",options:["Writing code","Maximizing product value by managing the Product Backlog and priorities","Managing the team","Running servers"],correctAnswer:1,explanation:"The Product Owner maximizes product value by managing the Product Backlog, defining priorities, and representing stakeholder needs."},{id:"agile-26",question:"What is a Scrum Master responsible for?",options:["Being the boss","Facilitating Scrum processes, removing impediments, and coaching the team","Writing requirements","Deploying code"],correctAnswer:1,explanation:"The Scrum Master is a servant-leader who facilitates Scrum processes, removes impediments, and coaches the team on Agile practices."},{id:"agile-27",question:"What is an Epic in Agile?",options:["An amazing feature","A large body of work that can be broken down into smaller user stories","A critical bug","A deployment milestone"],correctAnswer:1,explanation:"An Epic is a large user story that is too big to complete in one Sprint and needs to be broken down into smaller stories."},{id:"agile-28",question:"What is acceptance criteria?",options:["Hiring criteria","Conditions that a user story must satisfy to be accepted as complete","Code review standards","Performance benchmarks"],correctAnswer:1,explanation:"Acceptance criteria are specific conditions that a user story must meet for it to be considered done and accepted by the Product Owner."},{id:"agile-29",question:"What is a spike in Agile?",options:["A sudden increase in bugs","A time-boxed research task to explore a solution or reduce uncertainty","A performance spike","A traffic surge"],correctAnswer:1,explanation:"A spike is a time-boxed investigation or research task to gain knowledge, reduce uncertainty, or explore technical approaches."},{id:"agile-30",question:"What is technical debt?",options:["Money owed for technology","The cost of shortcuts or poor code that must be addressed later","Server costs","License fees"],correctAnswer:1,explanation:"Technical debt is the implied cost of rework caused by choosing quick/easy solutions instead of better approaches that take longer."},{id:"agile-31",question:"What is a minimum viable product (MVP)?",options:["The cheapest product","A version with just enough features to satisfy early customers and provide feedback","A product with minimum bugs","A fully featured product"],correctAnswer:1,explanation:"An MVP is a product with enough features to attract early adopters and validate the product idea with minimal effort."},{id:"agile-32",question:"What is backlog grooming (refinement)?",options:["Cleaning up code","Reviewing and updating Product Backlog items to ensure they are ready for upcoming sprints","Deleting old tickets","Organizing files"],correctAnswer:1,explanation:"Backlog refinement involves reviewing, re-prioritizing, and adding detail to Product Backlog items to prepare them for Sprint Planning."},{id:"agile-33",question:"What is a cross-functional team?",options:["A team from different companies","A team with all the skills needed to deliver a product without external dependencies","A team that works across time zones","A team that uses multiple programming languages"],correctAnswer:1,explanation:"A cross-functional team has all necessary skills (development, testing, design) to deliver work without depending on external teams."},{id:"agile-34",question:"What is the Waterfall methodology?",options:["An Agile method","A linear sequential approach where each phase must complete before the next begins","A rapid development method","A testing approach"],correctAnswer:1,explanation:"Waterfall is a linear sequential methodology where phases (requirements, design, implementation, testing, deployment) follow in order."},{id:"agile-35",question:"What is the main difference between Agile and Waterfall?",options:["No difference","Agile is iterative and adaptive; Waterfall is linear and sequential","Waterfall is faster","Agile has more documentation"],correctAnswer:1,explanation:"Agile delivers work iteratively with flexibility to change. Waterfall follows a rigid linear sequence of phases."},{id:"agile-36",question:"What is a code review?",options:["Reviewing code documentation","A practice where peers examine code changes for quality, bugs, and adherence to standards","A performance review","An automated test"],correctAnswer:1,explanation:"Code review is the practice of having peers examine code changes to find defects, improve quality, and share knowledge."},{id:"agile-37",question:"What is Git?",options:["A programming language","A distributed version control system for tracking changes in source code","A project management tool","A testing framework"],correctAnswer:1,explanation:"Git is a distributed version control system that tracks changes in files, enabling collaboration and version history management."},{id:"agile-38",question:"What is a Git branch?",options:["A tree branch","An independent line of development that diverges from the main codebase","A file copy","A deployment environment"],correctAnswer:1,explanation:"A Git branch is an independent line of development, allowing parallel work on features without affecting the main codebase."},{id:"agile-39",question:"What is a Pull Request (PR)?",options:["Pulling data from a server","A request to merge code changes into a branch after review","Requesting access","Downloading code"],correctAnswer:1,explanation:"A Pull Request proposes code changes for review and discussion before merging into the target branch."},{id:"agile-40",question:"What is the purpose of a Sprint Goal?",options:["A personal goal","A short statement describing what the team aims to achieve during the Sprint","A performance target","A deadline"],correctAnswer:1,explanation:"The Sprint Goal is a concise statement that provides the team with a clear objective and purpose for the Sprint."},{id:"agile-41",question:"What is Extreme Programming (XP)?",options:["Extreme coding competitions","An Agile methodology emphasizing technical practices like TDD, pair programming, and CI","Programming under pressure","Late-night coding"],correctAnswer:1,explanation:"XP is an Agile methodology that emphasizes technical excellence through practices like TDD, pair programming, and continuous integration."},{id:"agile-42",question:"What is a Definition of Ready (DoR)?",options:["When hardware is set up","Criteria that a user story must meet before it can be brought into a Sprint","A deployment checklist","A hiring criterion"],correctAnswer:1,explanation:"The Definition of Ready defines criteria that backlog items must meet before they can be selected for Sprint Planning."},{id:"agile-43",question:"What is a release plan?",options:["A press release","A high-level plan that maps features to future sprints or releases","A deployment script","A marketing plan"],correctAnswer:1,explanation:"A release plan is a high-level timeline showing which features will be delivered in upcoming releases or sprints."},{id:"agile-44",question:"What is the Fibonacci sequence used for in Agile?",options:["Mathematical calculations","Estimating story points (1, 2, 3, 5, 8, 13, 21) to reflect increasing uncertainty","Counting sprints","Numbering user stories"],correctAnswer:1,explanation:"Fibonacci numbers are used for story point estimation because the gaps between numbers grow, reflecting increasing uncertainty in larger stories."},{id:"agile-45",question:"What is planning poker?",options:["A card game","An estimation technique where team members simultaneously reveal story point estimates","Planning team activities","A scheduling tool"],correctAnswer:1,explanation:"Planning poker is a consensus-based estimation technique where team members independently estimate using cards, then discuss differences."},{id:"agile-46",question:"What is a standup meeting?",options:["A meeting while standing","A brief daily sync where each team member shares progress, plans, and blockers","An important presentation","A comedy event"],correctAnswer:1,explanation:"A standup is a brief daily meeting (often done standing to keep it short) where team members synchronize on progress and blockers."},{id:"agile-47",question:"What is Lean software development?",options:["Writing less code","Applying Lean manufacturing principles to software: eliminate waste, deliver fast","Using fewer developers","Minimalist design"],correctAnswer:1,explanation:"Lean development applies manufacturing principles to software: eliminate waste, amplify learning, deliver fast, and build quality in."},{id:"agile-48",question:"What is a blocker in Agile?",options:["An ad blocker","An impediment that prevents a team member from making progress on their work","A firewall","A code comment"],correctAnswer:1,explanation:"A blocker is any impediment or obstacle that prevents a team member or the team from making progress on their current work."},{id:"agile-49",question:"What is Jira?",options:["A programming language","A project management tool by Atlassian commonly used for Agile project tracking","A version control system","A cloud provider"],correctAnswer:1,explanation:"Jira is a popular project management and issue tracking tool by Atlassian, widely used for Agile software development."},{id:"agile-50",question:"What is the difference between a bug and a feature request?",options:["No difference","A bug is unintended behavior to fix; a feature request is new desired functionality","Bugs are more important","Feature requests are bugs"],correctAnswer:1,explanation:"A bug is an unintended defect in existing functionality. A feature request is a proposal for new functionality or enhancement."}],Ah=[{id:"db-1",question:"What SQL clause is used to filter records?",options:["ORDER BY","WHERE","GROUP BY","HAVING"],correctAnswer:1,explanation:"The WHERE clause filters records based on specified conditions, e.g., `SELECT * FROM users WHERE age > 18`."},{id:"db-2",question:"What is the difference between WHERE and HAVING?",options:["No difference","WHERE filters rows before grouping; HAVING filters groups after GROUP BY","HAVING filters rows before GROUP BY","WHERE is only for NULL values"],correctAnswer:1,explanation:"WHERE filters individual rows before aggregation. HAVING filters aggregated groups after GROUP BY is applied."},{id:"db-3",question:"Which SQL statement is used to extract data from a database?",options:["GET","EXTRACT","SELECT","PULL"],correctAnswer:2,explanation:"SELECT is the SQL statement used to query and retrieve data from one or more tables."},{id:"db-4",question:"What does `SELECT * FROM users` return?",options:["Only user IDs","All columns and all rows from the users table","Only the first row","Column names only"],correctAnswer:1,explanation:"`SELECT *` selects all columns, and without a WHERE clause, it returns all rows from the table."},{id:"db-5",question:"What is a primary key?",options:["Any column in a table","A column (or set) that uniquely identifies each row, cannot be NULL, must be unique","A foreign key","The first column"],correctAnswer:1,explanation:"A primary key uniquely identifies each row. It must contain unique values and cannot be NULL."},{id:"db-6",question:"What is a foreign key?",options:["A key from another country","A column that references the primary key of another table, creating a relationship","An alternate key","A secondary password"],correctAnswer:1,explanation:"A foreign key establishes a link between two tables by referencing the primary key of another table."},{id:"db-7",question:"What does the JOIN clause do?",options:["Deletes tables","Combines rows from two or more tables based on a related column","Creates a new table","Updates data"],correctAnswer:1,explanation:"JOIN combines rows from multiple tables based on a related column between them (like matching customer_id)."},{id:"db-8",question:"What is the difference between INNER JOIN and LEFT JOIN?",options:["No difference","INNER JOIN returns only matching rows; LEFT JOIN returns all left table rows plus matching right rows","LEFT JOIN returns only matching rows","INNER JOIN is slower"],correctAnswer:1,explanation:"INNER JOIN returns only rows with matches in both tables. LEFT JOIN returns all rows from the left table, with NULLs for non-matches."},{id:"db-9",question:"Which aggregate function returns the number of rows?",options:["SUM()","COUNT()","AVG()","TOTAL()"],correctAnswer:1,explanation:"COUNT() returns the number of rows. Example: `SELECT COUNT(*) FROM users` returns total user count."},{id:"db-10",question:"What does GROUP BY do?",options:["Groups tables together","Groups rows with the same values into summary rows, used with aggregate functions","Sorts data","Filters rows"],correctAnswer:1,explanation:"GROUP BY groups rows with identical values in specified columns, typically used with aggregate functions (COUNT, SUM, AVG)."},{id:"db-11",question:"Write a query to get the average salary per department",options:["SELECT AVG(salary) FROM employees","SELECT department, AVG(salary) FROM employees GROUP BY department","SELECT department FROM employees WHERE AVG(salary)","SELECT AVG(salary) GROUP BY department"],correctAnswer:1,explanation:"Use GROUP BY with the aggregate AVG() function: `SELECT department, AVG(salary) FROM employees GROUP BY department`."},{id:"db-12",question:"What is normalization in databases?",options:["Making all data the same","Organizing data to reduce redundancy and improve data integrity through normal forms","Deleting old data","Converting data types"],correctAnswer:1,explanation:"Normalization organizes data into tables to minimize redundancy and dependency (1NF, 2NF, 3NF, BCNF)."},{id:"db-13",question:"What is 1NF (First Normal Form)?",options:["Tables must have primary keys","Each column contains atomic (indivisible) values, no repeating groups","All tables must be related","No foreign keys allowed"],correctAnswer:1,explanation:"1NF requires atomic values in each column and no repeating groups. Each cell must contain a single value."},{id:"db-14",question:"What is 3NF (Third Normal Form)?",options:["Three tables minimum","In 2NF and no transitive dependencies (non-key columns don't depend on other non-key columns)","Three columns minimum","Three primary keys"],correctAnswer:1,explanation:"3NF requires 2NF compliance plus no transitive dependencies: non-key attributes must depend only on the primary key."},{id:"db-15",question:"What is an index in a database?",options:["A table of contents","A data structure that speeds up data retrieval at the cost of storage and write performance","A primary key","A unique constraint"],correctAnswer:1,explanation:"An index is a data structure (often B-tree) that speeds up SELECT queries but slows down INSERT/UPDATE and uses extra storage."},{id:"db-16",question:"When should you NOT create an index?",options:["On columns used in WHERE clauses","On small tables or columns with low cardinality (few unique values)","On foreign keys","On primary keys"],correctAnswer:1,explanation:"Avoid indexes on small tables, columns with few unique values (boolean), or tables with frequent heavy writes."},{id:"db-17",question:"What does ACID stand for in databases?",options:["Automated, Controlled, Isolated, Durable","Atomicity, Consistency, Isolation, Durability","Advanced Computing In Databases","Access, Create, Insert, Delete"],correctAnswer:1,explanation:"ACID properties ensure reliable transactions: Atomicity (all or nothing), Consistency, Isolation, Durability."},{id:"db-18",question:"What is Atomicity in ACID?",options:["Data is atomic (indivisible)","A transaction is all or nothing - either all operations complete or none do","Transactions are atomic size","Only one transaction at a time"],correctAnswer:1,explanation:"Atomicity means a transaction is indivisible - all operations succeed, or if any fail, the entire transaction is rolled back."},{id:"db-19",question:"What is a transaction in SQL?",options:["A financial operation","A unit of work (one or more SQL statements) treated as a single atomic unit","A database backup","A data migration"],correctAnswer:1,explanation:"A transaction groups SQL statements that either all succeed (COMMIT) or all fail (ROLLBACK) together."},{id:"db-20",question:"What does COMMIT do in SQL?",options:["Cancels a transaction","Permanently saves all changes made in the current transaction","Creates a backup","Starts a new transaction"],correctAnswer:1,explanation:"COMMIT permanently saves all changes made during the current transaction to the database."},{id:"db-21",question:"What does ROLLBACK do in SQL?",options:["Saves changes","Undoes all changes made in the current transaction, restoring previous state","Deletes the database","Creates a backup"],correctAnswer:1,explanation:"ROLLBACK undoes all changes made in the current transaction, returning the database to its pre-transaction state."},{id:"db-22",question:"What is a deadlock in a database?",options:["A broken lock","When two or more transactions wait for each other to release locks, creating a circular dependency","A security feature","A password expiration"],correctAnswer:1,explanation:"A deadlock occurs when transactions form a circular wait for each other's locks. The DBMS detects and resolves it (by killing one)."},{id:"db-23",question:"What is the difference between DELETE and TRUNCATE?",options:["No difference","DELETE removes specific rows (logged, can use WHERE); TRUNCATE removes all rows (faster, minimal logging)","TRUNCATE can filter rows","DELETE is faster"],correctAnswer:1,explanation:"DELETE removes rows individually with full logging, can use WHERE. TRUNCATE removes all rows with minimal logging, much faster."},{id:"db-24",question:"What is a view in a database?",options:["A graphical display","A virtual table based on a saved SQL query, not storing data itself","A user interface","A report"],correctAnswer:1,explanation:"A view is a virtual table based on a saved SELECT query. It doesn't store data but presents data from underlying tables."},{id:"db-25",question:"What is a stored procedure?",options:["A saved file","A precompiled SQL code block stored in the database that can be called with parameters","A backup procedure","A maintenance script"],correctAnswer:1,explanation:"A stored procedure is precompiled SQL code saved in the database, callable with parameters, improving performance and security."},{id:"db-26",question:"What is the difference between a stored procedure and a function?",options:["No difference","Functions must return a value; procedures don't have to return values","Procedures are faster","Functions can modify data"],correctAnswer:1,explanation:"Functions must return a value and can be used in SELECT. Procedures may or may not return values and are called with EXECUTE."},{id:"db-27",question:"What is SQL injection?",options:["Injecting SQL code","A security attack where malicious SQL code is inserted through application inputs","A way to speed up queries","Adding new tables"],correctAnswer:1,explanation:"SQL injection is a security vulnerability where attackers insert malicious SQL through application inputs to manipulate the database."},{id:"db-28",question:"How can you prevent SQL injection?",options:["Stronger passwords","Using parameterized queries (prepared statements) instead of string concatenation","Encrypting the database","Using a firewall only"],correctAnswer:1,explanation:"Parameterized queries separate SQL code from user input, preventing malicious input from being executed as SQL."},{id:"db-29",question:"What is a NoSQL database?",options:["A database without SQL support","A non-relational database designed for flexible schemas and horizontal scaling","A SQL replacement","A file-based database"],correctAnswer:1,explanation:"NoSQL databases (MongoDB, Cassandra, Redis) are non-relational, offering flexible schemas and horizontal scaling for specific use cases."},{id:"db-30",question:"When would you choose NoSQL over SQL?",options:["Always choose NoSQL","When you need flexible schemas, horizontal scaling, or handle unstructured/semi-structured data","For financial systems","When data is highly structured"],correctAnswer:1,explanation:"Choose NoSQL for flexible schemas, horizontal scaling, unstructured data, or when rapid development is needed."},{id:"db-31",question:"What type of NoSQL database is MongoDB?",options:["Key-value store","Document database","Column-family store","Graph database"],correctAnswer:1,explanation:"MongoDB is a document database that stores data in JSON-like documents (BSON), offering flexible schemas."},{id:"db-32",question:"What is the purpose of the DISTINCT keyword in SQL?",options:["Making data unique","Removing duplicate rows from the query result","Creating unique indexes","Filtering NULL values"],correctAnswer:1,explanation:"DISTINCT removes duplicate rows from the result set: `SELECT DISTINCT city FROM customers`."},{id:"db-33",question:"What does ORDER BY do in SQL?",options:["Orders data randomly","Sorts the result set by one or more columns in ascending (ASC) or descending (DESC) order","Orders tables","Creates indexes"],correctAnswer:1,explanation:"ORDER BY sorts results: `SELECT * FROM users ORDER BY name ASC, age DESC` sorts by name ascending, then age descending."},{id:"db-34",question:"What is a subquery?",options:["A smaller query","A query nested inside another query, used to provide results for the outer query","A quick query","A backup query"],correctAnswer:1,explanation:"A subquery is a query inside another query, used to filter, compare, or provide data for the outer query."},{id:"db-35",question:"What is a CTE (Common Table Expression)?",options:["A table of contents","A temporary named result set defined with WITH clause, used within a single query","A permanent table","A view"],correctAnswer:1,explanation:"A CTE (WITH clause) creates a temporary named result set for the duration of a single query, improving readability."},{id:"db-36",question:"What does the UNION operator do?",options:["Joins tables horizontally","Combines results of two SELECT statements vertically, removing duplicates","Creates a union of databases","Merges columns"],correctAnswer:1,explanation:"UNION combines result sets vertically (appending rows). Use UNION ALL to keep duplicates."},{id:"db-37",question:"What is a database schema?",options:["A database backup","The logical structure defining tables, columns, data types, constraints, and relationships","A security policy","A user account"],correctAnswer:1,explanation:"A schema defines the logical structure: tables, columns, data types, constraints, indexes, and relationships."},{id:"db-38",question:"What are constraints in a database?",options:["Performance limits","Rules enforcing data integrity: NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY, CHECK","Storage limits","Speed limits"],correctAnswer:1,explanation:"Constraints enforce data integrity: NOT NULL (no nulls), UNIQUE (no duplicates), PRIMARY KEY, FOREIGN KEY, CHECK (custom rules)."},{id:"db-39",question:"What is denormalization?",options:["The opposite of normalization","Intentionally adding redundancy to improve read performance at the cost of update complexity","Removing all tables","Deleting indexes"],correctAnswer:1,explanation:"Denormalization adds redundancy to optimize read performance. Common in data warehouses and read-heavy applications."},{id:"db-40",question:"What is database sharding?",options:["Breaking a database","Horizontally partitioning data across multiple database instances for scalability","Encrypting data","Backing up data"],correctAnswer:1,explanation:"Sharding splits data horizontally across multiple servers (shards), enabling horizontal scaling for large datasets."},{id:"db-41",question:"What is database replication?",options:["Copying the database software","Copying data from one database to others for redundancy, high availability, and read scaling","Backing up data","Duplicating queries"],correctAnswer:1,explanation:"Replication copies data between database servers for high availability, disaster recovery, and read scaling."},{id:"db-42",question:"What is the difference between master-slave and master-master replication?",options:["No difference","Master-slave: one writes, others read. Master-master: all can write","Master-master is more common","Master-slave allows writes everywhere"],correctAnswer:1,explanation:"Master-slave: one primary for writes, replicas for reads. Master-master: all nodes can accept writes (more complex conflict handling)."},{id:"db-43",question:"What is the CAP theorem?",options:["A SQL theorem","A distributed system can only guarantee 2 of 3: Consistency, Availability, Partition tolerance","A database design theorem","A security theorem"],correctAnswer:1,explanation:"CAP theorem states distributed systems can provide at most 2 of: Consistency (all nodes see same data), Availability, Partition tolerance."},{id:"db-44",question:"What is a connection pool?",options:["A swimming pool","A cache of reusable database connections, reducing overhead of creating new ones","A group of databases","A network connection"],correctAnswer:1,explanation:"A connection pool maintains reusable database connections, improving performance by avoiding the overhead of creating new connections."},{id:"db-45",question:"What is an ORM (Object-Relational Mapping)?",options:["A database type","A technique mapping database tables to programming language objects, allowing DB operations through code","A query language","A backup tool"],correctAnswer:1,explanation:"ORM maps tables to classes and rows to objects, enabling database operations using your programming language (e.g., Prisma, SQLAlchemy)."},{id:"db-46",question:"What is database migration?",options:["Moving to a new server","Version-controlled, incremental changes to database schema over time","Backing up data","Importing data"],correctAnswer:1,explanation:"Migrations are version-controlled schema changes that evolve the database over time, allowing rollback and team collaboration."},{id:"db-47",question:"What is the difference between CHAR and VARCHAR?",options:["No difference","CHAR is fixed-length (padded with spaces); VARCHAR is variable-length (uses only needed space)","VARCHAR is fixed-length","CHAR is for characters only"],correctAnswer:1,explanation:"CHAR(n) stores fixed-length strings padded to n characters. VARCHAR(n) stores variable-length strings up to n characters."},{id:"db-48",question:"What is the LIKE operator in SQL?",options:["A social feature","A pattern matching operator used with wildcards in WHERE clauses (% for any, _ for single char)","A comparison operator","A join operator"],correctAnswer:1,explanation:"LIKE matches patterns: `%` matches any sequence, `_` matches a single character. Example: `WHERE name LIKE 'John%'`."},{id:"db-49",question:"What is the difference between TRUNCATE and DROP?",options:["No difference","TRUNCATE removes all data but keeps the table; DROP removes the entire table including its structure","DROP only removes data","TRUNCATE deletes the table"],correctAnswer:1,explanation:"TRUNCATE removes all rows but keeps the table structure. DROP removes the entire table including structure, data, and indexes."},{id:"db-50",question:"What is the EXPLAIN statement used for?",options:["Explaining SQL syntax","Displaying the execution plan of a query for performance optimization","Documenting queries","Teaching SQL"],correctAnswer:1,explanation:"EXPLAIN shows how the database will execute a query: tables accessed, indexes used, join methods - essential for optimization."}],xh=[{id:"net-1",question:"What does the TCP/IP model have that the OSI model doesn't explicitly separate?",options:["Application and Presentation layers combined","Network and Data Link layers combined","Session layer merged into Application","Physical layer removed"],correctAnswer:2,explanation:"The TCP/IP model combines OSI's Application, Presentation, and Session layers into a single Application layer."},{id:"net-2",question:"Which protocol operates at the Transport layer and provides reliable, connection-oriented communication?",options:["UDP","TCP","IP","HTTP"],correctAnswer:1,explanation:"TCP (Transmission Control Protocol) operates at Layer 4 (Transport) and provides reliable, ordered, error-checked delivery of data."},{id:"net-3",question:"What port does HTTPS use by default?",options:["80","443","8080","21"],correctAnswer:1,explanation:"HTTPS uses port 443 by default. HTTP uses port 80."},{id:"net-4",question:"What is the purpose of ARP (Address Resolution Protocol)?",options:["Resolves domain names to IP addresses","Maps IP addresses to MAC addresses on a local network","Routes packets between networks","Assigns IP addre
