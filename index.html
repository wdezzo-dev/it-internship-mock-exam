 and types","Compares references only"],correctAnswer:2,explanation:"The strict equality operator (===) checks both value and type without type coercion."},{id:"js-4",question:"Which keyword is used to declare a constant in JavaScript?",options:["var","let","const","constant"],correctAnswer:2,explanation:"`const` declares a block-scoped constant whose value cannot be reassigned."},{id:"js-5",question:"What is a closure in JavaScript?",options:["A way to close the browser window","A function that has access to variables from its outer scope","A method to end a loop","A type of error handling"],correctAnswer:1,explanation:"A closure is a function that retains access to variables from its lexical scope even after the outer function has returned."},{id:"js-6",question:"Which array method creates a new array with the results of calling a function on every element?",options:["forEach()","map()","filter()","reduce()"],correctAnswer:1,explanation:"map() creates a new array populated with the results of calling a provided function on every element."},{id:"js-7",question:"What is the purpose of the `async` keyword in JavaScript?",options:["Makes a function synchronous","Declares a function that returns a Promise","Pauses execution","Creates a new thread"],correctAnswer:1,explanation:"The async keyword declares an asynchronous function that implicitly returns a Promise."},{id:"js-8",question:"What will `console.log(0.1 + 0.2 === 0.3)` output?",options:["true","false","undefined","NaN"],correctAnswer:1,explanation:"Due to floating-point precision issues, 0.1 + 0.2 equals 0.30000000000000004, not exactly 0.3."},{id:"js-9",question:"Which of the following is NOT a JavaScript data type?",options:["Symbol","BigInt","Float","undefined"],correctAnswer:2,explanation:'Float is not a JavaScript data type. JavaScript uses "number" for all numeric values (both integer and floating-point).'},{id:"js-10",question:"What does the `spread operator (...)` do?",options:["Spreads errors across functions","Expands an iterable into individual elements","Creates a new variable","Deletes array elements"],correctAnswer:1,explanation:"The spread operator expands an iterable (like an array) into individual elements."},{id:"js-11",question:"What is event delegation in JavaScript?",options:["Assigning events to every child element","Using a parent element to handle events for its children","Removing event listeners","Creating custom events"],correctAnswer:1,explanation:"Event delegation uses event bubbling to handle events at a higher level in the DOM rather than attaching handlers to individual elements."},{id:"js-12",question:"What is the difference between `let` and `var`?",options:["No difference","`let` is function-scoped, `var` is block-scoped","`let` is block-scoped, `var` is function-scoped","`let` cannot be reassigned"],correctAnswer:2,explanation:"`let` is block-scoped (limited to the block where defined), while `var` is function-scoped."},{id:"js-13",question:"What does `Promise.all()` do?",options:["Resolves when the first promise resolves","Resolves when all promises resolve, rejects if any reject","Always resolves regardless of individual promise results","Runs promises sequentially"],correctAnswer:1,explanation:"Promise.all() takes an array of promises and resolves when all of them resolve. It rejects immediately if any promise rejects."},{id:"js-14",question:"Which method removes the last element from an array and returns it?",options:["shift()","pop()","splice()","slice()"],correctAnswer:1,explanation:"pop() removes the last element from an array and returns that element."},{id:"js-15",question:"What is hoisting in JavaScript?",options:["Moving code to a server","Declarations are moved to the top of their scope before execution","A design pattern","A way to optimize code"],correctAnswer:1,explanation:"Hoisting is JavaScript's default behavior of moving declarations to the top of the current scope during compilation."},{id:"js-16",question:"What is the output of `console.log(typeof NaN)`?",options:['"NaN"','"undefined"','"number"','"object"'],correctAnswer:2,explanation:'NaN (Not a Number) is ironically of type "number" in JavaScript.'},{id:"js-17",question:"What does `Array.prototype.reduce()` do?",options:["Reduces the size of an array","Filters elements from an array","Executes a reducer function on each element, resulting in a single value","Removes duplicate elements"],correctAnswer:2,explanation:"reduce() executes a reducer function on each element of the array, resulting in a single output value."},{id:"js-18",question:"What is the purpose of `Object.freeze()`?",options:["Deletes an object","Prevents adding, removing, or modifying properties","Creates a deep copy","Converts object to string"],correctAnswer:1,explanation:"Object.freeze() freezes an object, preventing new properties from being added and existing properties from being modified or removed."},{id:"js-19",question:"What is a callback function?",options:["A function that calls itself","A function passed as an argument to another function","A function that returns another function","A function called by the browser"],correctAnswer:1,explanation:"A callback is a function passed as an argument to another function, to be executed later."},{id:"js-20",question:"Which statement about arrow functions is TRUE?",options:["They have their own `this` context","They cannot take parameters","They inherit `this` from the enclosing scope","They must always use curly braces"],correctAnswer:2,explanation:"Arrow functions do not have their own `this` context; they inherit it from the enclosing lexical scope."},{id:"js-21",question:"What does `setTimeout` return?",options:["undefined","A Promise","A timer ID (number)","null"],correctAnswer:2,explanation:"setTimeout returns a numeric timer ID that can be used with clearTimeout to cancel the timer."},{id:"js-22",question:"What is destructuring in JavaScript?",options:["Destroying variables","Extracting values from arrays or objects into distinct variables","Removing properties from objects","Breaking code into modules"],correctAnswer:1,explanation:"Destructuring allows you to unpack values from arrays or properties from objects into distinct variables."},{id:"js-23",question:"What is the event loop in JavaScript?",options:["A loop that iterates over events","A mechanism that handles asynchronous callbacks by checking the call stack and task queue","A method for creating events","A type of for loop"],correctAnswer:1,explanation:"The event loop continuously checks if the call stack is empty and pushes callbacks from the task queue to the call stack."},{id:"js-24",question:"What is the difference between `null` and `undefined`?",options:["They are the same","`null` is an intentional absence of value; `undefined` means a variable has been declared but not assigned","`undefined` is an intentional absence of value; `null` means not declared","`null` is for numbers, `undefined` is for strings"],correctAnswer:1,explanation:"`null` represents an intentional absence of any value, while `undefined` means a variable has been declared but not yet assigned a value."},{id:"js-25",question:"Which method is used to add one or more elements to the beginning of an array?",options:["push()","unshift()","concat()","splice()"],correctAnswer:1,explanation:"unshift() adds one or more elements to the beginning of an array and returns the new length."},{id:"js-26",question:'What does `"use strict"` do in JavaScript?',options:["Makes the code run faster","Enables strict mode which catches common coding errors and prevents unsafe actions","Enforces TypeScript rules","Disables console.log"],correctAnswer:1,explanation:'"use strict" enables strict mode which helps catch common coding mistakes and prevents the use of certain error-prone features.'},{id:"js-27",question:"What is the purpose of the `fetch` API?",options:["To fetch data from the DOM","To make HTTP requests to servers","To import modules","To get user input"],correctAnswer:1,explanation:"The Fetch API provides a modern interface for making HTTP requests to servers and returns Promises."},{id:"js-28",question:"What is a JavaScript module?",options:["A separate HTML file","A reusable piece of code that can be exported and imported","A CSS framework","A type of variable"],correctAnswer:1,explanation:"A module is a file containing reusable code that can export functions, objects, or values for use in other files via import."},{id:"js-29",question:"What does `Object.keys()` return?",options:["An array of the object's values","An array of the object's property names","The number of properties","A new object"],correctAnswer:1,explanation:"Object.keys() returns an array of a given object's own enumerable property names."},{id:"js-30",question:"What is optional chaining (`?.`) in JavaScript?",options:["A way to create optional parameters","Safely accesses nested object properties without error if a reference is nullish","A ternary operator shorthand","A way to chain promises"],correctAnswer:1,explanation:"Optional chaining (?.) allows reading the value of a property deep in a chain of objects without having to check each reference."},{id:"js-31",question:"What is the difference between `==` and `===`?",options:["No difference","`==` compares with type coercion, `===` compares without type coercion","`===` compares with type coercion, `==` compares without","`==` is for strings, `===` is for numbers"],correctAnswer:1,explanation:"`==` performs type coercion before comparison, while `===` (strict equality) compares both value and type without coercion."},{id:"js-32",question:"What is `this` keyword in JavaScript?",options:["Always refers to the global object","Refers to the current function","Refers to the object that is executing the current function","Is always undefined"],correctAnswer:2,explanation:"`this` refers to the object that is executing the current function. Its value depends on how the function is called."},{id:"js-33",question:"What is a template literal in JavaScript?",options:["A string wrapped in single quotes","A string wrapped in backticks that allows embedded expressions","A predefined string template","A way to create HTML templates"],correctAnswer:1,explanation:"Template literals use backticks (`) and allow embedded expressions using ${expression} syntax, as well as multiline strings."},{id:"js-34",question:"What does `Array.isArray()` do?",options:["Creates a new array","Checks if a value is an array","Converts a value to an array","Returns the array length"],correctAnswer:1,explanation:"Array.isArray() determines whether the passed value is an Array, returning true or false."},{id:"js-35",question:"What is the purpose of `try...catch` in JavaScript?",options:["To loop through arrays","To handle errors and exceptions gracefully","To try different variable values","To test code performance"],correctAnswer:1,explanation:"try...catch allows you to handle errors gracefully by catching exceptions that occur in the try block."},{id:"js-36",question:"What is the difference between `slice()` and `splice()`?",options:["They are the same","`slice()` returns a new array without modifying original; `splice()` modifies the original array","`splice()` returns a new array; `slice()` modifies the original","`slice()` is for strings, `splice()` is for arrays"],correctAnswer:1,explanation:"slice() returns a shallow copy of a portion of an array without modifying it. splice() changes the original array by adding/removing elements."},{id:"js-37",question:"What is the `Map` object in JavaScript?",options:["Same as Array.map()","A collection of key-value pairs where keys can be any type","A function to create maps","A CSS mapping tool"],correctAnswer:1,explanation:"Map is a collection of key-value pairs where keys can be of any type (unlike objects where keys are strings/symbols)."},{id:"js-38",question:"What is the `Set` object in JavaScript?",options:["A way to set variable values","A collection of unique values","A setter function","A configuration object"],correctAnswer:1,explanation:"Set is a collection that stores unique values of any type. Duplicate values are automatically removed."},{id:"js-39",question:"What does `JSON.stringify()` do?",options:["Parses a JSON string","Converts a JavaScript object to a JSON string","Validates JSON","Creates a new JSON file"],correctAnswer:1,explanation:"JSON.stringify() converts a JavaScript object or value to a JSON string."},{id:"js-40",question:"What is the Nullish Coalescing Operator (??)?",options:["Same as the OR operator (||)","Returns the right operand when the left is null or undefined","Checks if a value is NaN","A bitwise operator"],correctAnswer:1,explanation:'The ?? operator returns the right-hand operand when the left-hand operand is null or undefined (not for falsy values like 0 or "").'},{id:"js-41",question:"What is a Generator function in JavaScript?",options:["A function that generates random numbers","A function that can be paused and resumed using yield","A function that creates objects","A function that runs automatically"],correctAnswer:1,explanation:"Generator functions (function*) can be paused and resumed, yielding multiple values on demand using the yield keyword."},{id:"js-42",question:"What does `localStorage` do?",options:["Stores data on the server","Stores key-value pairs in the browser with no expiration","Creates local variables","Stores data in memory only"],correctAnswer:1,explanation:"localStorage stores key-value pairs in the browser with no expiration date. Data persists even after the browser is closed."},{id:"js-43",question:"What is the difference between `for...in` and `for...of`?",options:["They are the same","`for...in` iterates over keys/properties; `for...of` iterates over values","`for...of` iterates over keys; `for...in` iterates over values","`for...in` is for arrays only"],correctAnswer:1,explanation:"`for...in` iterates over enumerable property names (keys), while `for...of` iterates over iterable values."},{id:"js-44",question:"What is `Symbol` in JavaScript?",options:["A special character","A unique and immutable primitive data type used as object property keys","A mathematical operator","A type of string"],correctAnswer:1,explanation:"Symbol is a primitive data type that creates unique identifiers, often used as property keys to avoid naming conflicts."},{id:"js-45",question:"What does the `new` keyword do in JavaScript?",options:["Creates a new variable","Creates an instance of an object from a constructor function","Declares a new function","Imports a new module"],correctAnswer:1,explanation:"The `new` keyword creates an instance of an object, setting up the prototype chain and calling the constructor function."},{id:"js-46",question:"What is `WeakMap` in JavaScript?",options:["A Map with fewer features","A Map where keys are weakly referenced and must be objects","A Map that expires after time","A slower version of Map"],correctAnswer:1,explanation:"WeakMap holds weak references to key objects, allowing them to be garbage collected if there are no other references."},{id:"js-47",question:"What is the `Proxy` object in JavaScript?",options:["A network proxy configuration","An object that wraps another object and intercepts operations like property access","A copy of an object","A type of Promise"],correctAnswer:1,explanation:"Proxy allows you to create a wrapper for another object that can intercept and redefine fundamental operations."},{id:"js-48",question:"What is `requestAnimationFrame` used for?",options:["Loading images","Scheduling a function to run before the next repaint for smooth animations","Creating CSS animations","Fetching animation data"],correctAnswer:1,explanation:"requestAnimationFrame tells the browser to call a specified function before the next repaint, enabling smooth animations."},{id:"js-49",question:"What is the `Intl` object used for?",options:["Internet operations","Internationalization: formatting numbers, dates, and strings per locale","Internal JavaScript operations","Intelligence/AI operations"],correctAnswer:1,explanation:"The Intl object provides language-sensitive string comparison, number formatting, and date/time formatting."},{id:"js-50",question:"What does `Object.assign()` do?",options:["Compares two objects","Copies properties from one or more source objects to a target object","Creates a deep clone","Deletes object properties"],correctAnswer:1,explanation:"Object.assign() copies all enumerable own properties from one or more source objects to a target object and returns the target."}],mh=[{id:"py-1",question:"What is the output of `print(type([]))`?",options:["<class 'array'>","<class 'list'>","<class 'tuple'>","<class 'dict'>"],correctAnswer:1,explanation:"In Python, [] creates a list, so type([]) returns <class 'list'>."},{id:"py-2",question:"Which keyword is used to define a function in Python?",options:["function","func","def","define"],correctAnswer:2,explanation:"The `def` keyword is used to define functions in Python."},{id:"py-3",question:"What is a list comprehension in Python?",options:["A way to understand lists","A concise way to create lists using a single line of code","A method to sort lists","A list documentation tool"],correctAnswer:1,explanation:"List comprehension provides a concise way to create lists, e.g., [x**2 for x in range(10)]."},{id:"py-4",question:"What is the difference between a list and a tuple in Python?",options:["No difference","Lists are mutable, tuples are immutable","Tuples are mutable, lists are immutable","Lists can only hold strings"],correctAnswer:1,explanation:"Lists are mutable (can be modified), while tuples are immutable (cannot be changed after creation)."},{id:"py-5",question:"What does the `__init__` method do in a Python class?",options:["Deletes the object","Initializes the object's attributes when created","Imports modules","Prints the object"],correctAnswer:1,explanation:"__init__ is the constructor method that initializes the object's attributes when a new instance is created."},{id:"py-6",question:"What is a decorator in Python?",options:["A CSS styling tool","A function that modifies the behavior of another function","A way to add comments","A type of variable"],correctAnswer:1,explanation:"A decorator is a function that takes another function and extends its behavior without explicitly modifying it, using @decorator syntax."},{id:"py-7",question:"What does `pip` stand for in Python?",options:["Python Installation Program","Pip Installs Packages","Python Interface Protocol","Package Import Program"],correctAnswer:1,explanation:'pip is a recursive acronym for "Pip Installs Packages" and is the standard package manager for Python.'},{id:"py-8",question:"What is the output of `print(2 ** 3)`?",options:["6","8","5","23"],correctAnswer:1,explanation:"** is the exponentiation operator in Python. 2 ** 3 = 2³ = 8."},{id:"py-9",question:"What is a virtual environment in Python?",options:["A virtual machine","An isolated environment for managing project-specific dependencies","A cloud server","A type of IDE"],correctAnswer:1,explanation:"A virtual environment is an isolated Python environment that allows you to manage dependencies for different projects separately."},{id:"py-10",question:"Which data structure uses key-value pairs in Python?",options:["List","Tuple","Dictionary","Set"],correctAnswer:2,explanation:'Dictionaries store data as key-value pairs, e.g., {"name": "John", "age": 30}.'},{id:"py-11",question:"What does `self` refer to in a Python class?",options:["The class itself","The current instance of the class","A global variable","The parent class"],correctAnswer:1,explanation:"`self` refers to the current instance of the class and is used to access instance attributes and methods."},{id:"py-12",question:"What is the purpose of `try-except` in Python?",options:["To loop through code","To handle exceptions and errors gracefully","To test code speed","To import modules"],correctAnswer:1,explanation:"try-except blocks handle exceptions gracefully, preventing the program from crashing when errors occur."},{id:"py-13",question:"What is a lambda function in Python?",options:["A named function","A small anonymous function defined with the lambda keyword","A function from the math library","A recursive function"],correctAnswer:1,explanation:"Lambda functions are small anonymous functions defined with the lambda keyword, e.g., lambda x: x * 2."},{id:"py-14",question:"What does the `with` statement do in Python?",options:["Creates a loop","Simplifies resource management by ensuring proper cleanup (context manager)","Imports modules","Defines a class"],correctAnswer:1,explanation:"The `with` statement simplifies resource management (like file handling) by ensuring proper setup and cleanup."},{id:"py-15",question:"What is the Global Interpreter Lock (GIL) in Python?",options:["A security feature","A mutex that allows only one thread to execute Python bytecode at a time","A global variable lock","A file locking mechanism"],correctAnswer:1,explanation:"The GIL is a mutex in CPython that allows only one thread to execute Python bytecode at a time, limiting true multi-threading."},{id:"py-16",question:"What is the difference between `append()` and `extend()` for lists?",options:["No difference","`append()` adds a single element; `extend()` adds each element of an iterable individually","`extend()` adds a single element; `append()` adds multiple","`append()` returns a new list"],correctAnswer:1,explanation:"append() adds its argument as a single element. extend() iterates over its argument and adds each element."},{id:"py-17",question:"What is a generator in Python?",options:["A function that generates random numbers","A function that uses yield to return values lazily one at a time","A class that creates objects","A module for generating data"],correctAnswer:1,explanation:"Generators are functions that use yield to produce a sequence of values lazily, one at a time, saving memory."},{id:"py-18",question:"What does `*args` do in a function definition?",options:["Creates a pointer","Allows a function to accept any number of positional arguments","Multiplies arguments","Makes arguments optional"],correctAnswer:1,explanation:"*args allows a function to accept any number of positional arguments, which are passed as a tuple."},{id:"py-19",question:"What does `**kwargs` do in a function definition?",options:["Creates keyword shortcuts","Allows a function to accept any number of keyword arguments","Powers arguments","Makes all arguments required"],correctAnswer:1,explanation:"**kwargs allows a function to accept any number of keyword arguments, which are passed as a dictionary."},{id:"py-20",question:'What is the purpose of `__name__ == "__main__"` in Python?',options:["Names the program","Checks if the script is being run directly (not imported)","Creates the main function","Sets the module name"],correctAnswer:1,explanation:'This idiom checks if the script is being run directly. When imported, __name__ is set to the module name, not "__main__".'},{id:"py-21",question:"What is `NumPy` primarily used for?",options:["Web development","Numerical computing with support for large multi-dimensional arrays","Database management","GUI development"],correctAnswer:1,explanation:"NumPy is a library for numerical computing that provides support for large, multi-dimensional arrays and mathematical functions."},{id:"py-22",question:"What is `pandas` used for in Python?",options:["Image processing","Data manipulation and analysis with DataFrames","Machine learning","Web scraping only"],correctAnswer:1,explanation:"pandas provides data structures (like DataFrames) and tools for data manipulation and analysis."},{id:"py-23",question:"What does `enumerate()` do?",options:["Counts the elements in a list","Returns an iterator of tuples containing index and value pairs","Numbers the lines of code","Creates a numbered list"],correctAnswer:1,explanation:"enumerate() adds a counter to an iterable, returning tuples of (index, value) pairs."},{id:"py-24",question:"What is a Python `set`?",options:["An ordered collection","An unordered collection of unique elements","A type of list","A configuration object"],correctAnswer:1,explanation:"A set is an unordered collection of unique elements. Duplicates are automatically removed."},{id:"py-25",question:"What is inheritance in Python OOP?",options:["Copying code between files","A class deriving properties and methods from another class","Importing modules","Creating backup copies of classes"],correctAnswer:1,explanation:"Inheritance allows a child class to inherit attributes and methods from a parent class, promoting code reuse."},{id:"py-26",question:"What does `map()` do in Python?",options:["Creates a geographic map","Applies a function to every item of an iterable and returns a map object","Maps variables to values","Creates a dictionary"],correctAnswer:1,explanation:"map() applies a given function to each item of an iterable and returns a map object (iterator)."},{id:"py-27",question:"What is the difference between `is` and `==` in Python?",options:["No difference","`is` checks identity (same object); `==` checks equality (same value)","`==` checks identity; `is` checks equality","`is` is faster than `==`"],correctAnswer:1,explanation:"`is` checks if two variables point to the same object in memory, while `==` checks if values are equal."},{id:"py-28",question:"What is slicing in Python?",options:["Cutting strings into characters","Extracting a portion of a sequence using [start:stop:step] syntax","Dividing code into functions","Splitting files"],correctAnswer:1,explanation:"Slicing extracts a portion of a sequence (list, string, tuple) using [start:stop:step] notation."},{id:"py-29",question:"What is `Flask` in Python?",options:["A data science library","A lightweight web framework","A testing tool","A database ORM"],correctAnswer:1,explanation:"Flask is a lightweight WSGI web application framework used for building web applications and APIs."},{id:"py-30",question:"What does the `@staticmethod` decorator do?",options:["Makes a method faster","Defines a method that doesn't access instance or class state","Makes a method private","Prevents method overriding"],correctAnswer:1,explanation:"@staticmethod defines a method that doesn't receive an implicit first argument (no self or cls), behaving like a regular function."},{id:"py-31",question:"What is the `range()` function used for?",options:["Measuring distance","Generating a sequence of numbers","Creating arrays","Setting variable limits"],correctAnswer:1,explanation:"range() generates a sequence of numbers, commonly used in for loops. It takes start, stop, and step parameters."},{id:"py-32",question:"What is `f-string` formatting in Python?",options:["A file string type",'String formatting using f"..." with embedded expressions in {}',"A function string","A format for JSON strings"],correctAnswer:1,explanation:'F-strings (f"...") allow embedding expressions directly inside string literals using curly braces, e.g., f"Hello {name}".'},{id:"py-33",question:"What does `zip()` do in Python?",options:["Compresses files","Combines multiple iterables element-wise into tuples","Unzips archives","Sorts elements"],correctAnswer:1,explanation:"zip() takes multiple iterables and returns an iterator of tuples, pairing elements from each iterable by position."},{id:"py-34",question:"What is a Python package?",options:["A compressed file","A directory containing modules and an __init__.py file","A single Python file","An executable program"],correctAnswer:1,explanation:"A Python package is a directory containing Python modules and typically an __init__.py file that marks it as a package."},{id:"py-35",question:"What is the purpose of `assert` in Python?",options:["To print values","To test if a condition is true, raising AssertionError if false","To assign values","To import modules"],correctAnswer:1,explanation:"assert tests a condition and raises an AssertionError if the condition is False. Used for debugging and testing."},{id:"py-36",question:"What is `Django` in Python?",options:["A machine learning library","A high-level web framework that follows the MVT pattern","A data visualization tool","A testing framework"],correctAnswer:1,explanation:"Django is a high-level Python web framework that encourages rapid development following the Model-View-Template (MVT) pattern."},{id:"py-37",question:"What does `filter()` do in Python?",options:["Removes duplicates","Filters elements of an iterable based on a function that returns True/False","Sorts elements","Transforms elements"],correctAnswer:1,explanation:"filter() constructs an iterator from elements of an iterable for which a function returns True."},{id:"py-38",question:"What is multiple inheritance in Python?",options:["Creating multiple objects","A class inheriting from more than one parent class","Multiple instances of a class","Importing multiple modules"],correctAnswer:1,explanation:"Multiple inheritance allows a class to inherit from more than one parent class, combining their attributes and methods."},{id:"py-39",question:"What is `pickle` used for in Python?",options:["Data visualization","Serializing and deserializing Python objects to/from byte streams","Encrypting data","Parsing HTML"],correctAnswer:1,explanation:"pickle serializes (pickles) Python objects into byte streams and deserializes (unpickles) them back into objects."},{id:"py-40",question:"What does the `pass` statement do?",options:["Passes a variable to a function","Acts as a placeholder that does nothing","Skips to the next iteration","Ends the program"],correctAnswer:1,explanation:"pass is a null operation — it does nothing. It's used as a placeholder in empty code blocks."},{id:"py-41",question:"What is type hinting in Python?",options:["Forcing variable types","Adding annotations to indicate expected types without enforcement","Converting types automatically","A way to create new types"],correctAnswer:1,explanation:"Type hints (PEP 484) allow you to annotate expected types for function parameters and return values, improving code readability."},{id:"py-42",question:"What is `asyncio` in Python?",options:["A synchronization tool","A library for writing asynchronous code using async/await","An audio processing library","A file I/O library"],correctAnswer:1,explanation:"asyncio is a library for writing concurrent code using the async/await syntax for asynchronous I/O operations."},{id:"py-43",question:"What is the difference between a shallow copy and a deep copy?",options:["No difference","Shallow copy copies references; deep copy copies the object and all nested objects","Deep copy copies references; shallow copy copies all objects","Shallow copy is faster but creates more memory"],correctAnswer:1,explanation:"Shallow copy creates a new object but references nested objects. Deep copy creates a completely independent copy of all nested objects."},{id:"py-44",question:"What is a `classmethod` in Python?",options:["A regular method","A method bound to the class rather than its instance, receiving cls as first parameter","A private method","A static method"],correctAnswer:1,explanation:"@classmethod defines a method bound to the class, not the instance. It receives the class (cls) as its first parameter."},{id:"py-45",question:"What does `__str__` method do in a Python class?",options:["Converts to integer","Returns a human-readable string representation of the object","Creates a new string","Compares strings"],correctAnswer:1,explanation:"__str__ returns a human-readable string representation of the object, called by str() and print()."},{id:"py-46",question:"What is a context manager in Python?",options:["A variable manager","An object that manages resources using __enter__ and __exit__ methods","A class manager","A memory manager"],correctAnswer:1,explanation:"Context managers handle resource setup and cleanup using __enter__ and __exit__ methods, typically used with the `with` statement."},{id:"py-47",question:"What is `pytest` used for?",options:["Web development","Testing Python code with a simple and scalable framework","Data analysis","Package management"],correctAnswer:1,explanation:"pytest is a testing framework that makes it easy to write simple and scalable tests for Python code."},{id:"py-48",question:"What does `yield` do in Python?",options:["Returns a value and terminates the function","Produces a value and suspends the function, maintaining its state","Creates a new variable","Imports a module"],correctAnswer:1,explanation:"yield produces a value and suspends the generator function's execution, maintaining its state for the next call."},{id:"py-49",question:"What is `PEP 8`?",options:["A Python version","Python's official style guide for writing clean, readable code","A Python package","A Python error code"],correctAnswer:1,explanation:"PEP 8 is the official style guide for Python code, providing conventions for formatting, naming, and structuring code."},{id:"py-50",question:"What is monkey patching in Python?",options:["A debugging technique","Dynamically modifying a class or module at runtime","A testing pattern","A code optimization technique"],correctAnswer:1,explanation:"Monkey patching is dynamically modifying or extending a class or module at runtime, often used in testing."}],hh=[{id:"react-1",question:"What is React?",options:["A full-stack framework","A JavaScript library for building user interfaces","A database management tool","A CSS framework"],correctAnswer:1,explanation:"React is a JavaScript library developed by Facebook for building user interfaces, particularly single-page applications."},{id:"react-2",question:"What is JSX?",options:["A new programming language","A syntax extension that allows writing HTML-like code in JavaScript","A JavaScript compiler","A CSS preprocessor"],correctAnswer:1,explanation:"JSX is a syntax extension for JavaScript that allows you to write HTML-like markup inside JavaScript code."},{id:"react-3",question:"What is the Virtual DOM?",options:["The actual browser DOM","A lightweight copy of the real DOM that React uses for efficient updates","A new HTML element","A database"],correctAnswer:1,explanation:"The Virtual DOM is a lightweight JavaScript representation of the real DOM. React uses it to efficiently determine what changes need to be made to the actual DOM."},{id:"react-4",question:"What is the purpose of `useState` hook?",options:["To fetch data from an API","To add state management to functional components","To handle routing","To style components"],correctAnswer:1,explanation:"useState is a React Hook that lets you add state variables to functional components, returning a state value and a setter function."},{id:"react-5",question:"What is the purpose of `useEffect` hook?",options:["To create visual effects","To perform side effects in functional components","To define component styles","To handle form submissions"],correctAnswer:1,explanation:"useEffect lets you perform side effects in functional components, such as data fetching, subscriptions, or DOM manipulation."},{id:"react-6",question:"What are props in React?",options:["CSS properties","Read-only data passed from parent to child components","State variables","Event handlers"],correctAnswer:1,explanation:"Props (properties) are read-only inputs passed from a parent component to a child component to configure its behavior."},{id:"react-7",question:"What is the key prop used for in React lists?",options:["To style list items","To help React identify which items have changed, added, or removed","To set the order of items","To filter list items"],correctAnswer:1,explanation:"The key prop helps React identify which items in a list have changed, been added, or removed, enabling efficient re-rendering."},{id:"react-8",question:"What is the difference between state and props?",options:["No difference","State is managed within a component; props are passed from parent","Props are managed within; state is passed from parent","Both are the same but with different names"],correctAnswer:1,explanation:"State is managed internally by a component and can be changed. Props are passed from parent to child and are read-only."},{id:"react-9",question:"What is a React component?",options:["An HTML element","A reusable piece of UI that can be a function or class","A CSS class","A JavaScript file"],correctAnswer:1,explanation:"A React component is a reusable, self-contained piece of UI that can be either a function or a class returning JSX."},{id:"react-10",question:"What is conditional rendering in React?",options:["Rendering based on screen size","Rendering different UI elements based on certain conditions","Rendering only on certain browsers","Rendering with animations"],correctAnswer:1,explanation:"Conditional rendering means showing different UI elements based on conditions, using if statements, ternary operators, or && operator."},{id:"react-11",question:"What is the `useContext` hook used for?",options:["Creating animations","Accessing context values without prop drilling","Managing local storage","Handling HTTP requests"],correctAnswer:1,explanation:"useContext allows you to subscribe to React context and access its value without wrapping components in Context.Consumer."},{id:"react-12",question:"What is `useRef` used for?",options:["Managing state","Creating a mutable reference that persists across renders","Handling events","Routing between pages"],correctAnswer:1,explanation:"useRef creates a mutable ref object that persists across renders, commonly used to access DOM elements directly."},{id:"react-13",question:"What is React Router used for?",options:["State management","Client-side routing and navigation between views","API calls","Styling components"],correctAnswer:1,explanation:"React Router enables client-side routing, allowing navigation between different views/pages without full page reloads."},{id:"react-14",question:"What is the purpose of `useMemo`?",options:["To memorize user input","To memoize expensive computations and avoid recalculation on every render","To store data in memory","To create memos/notes"],correctAnswer:1,explanation:"useMemo memoizes the result of an expensive computation, recalculating only when its dependencies change."},{id:"react-15",question:"What is `useCallback` used for?",options:["Making API callbacks","Memoizing a function to prevent unnecessary re-creation on re-renders","Handling errors","Creating callback URLs"],correctAnswer:1,explanation:"useCallback returns a memoized version of a callback function that only changes when its dependencies change."},{id:"react-16",question:"What is a Higher-Order Component (HOC)?",options:["A component at the top of the tree","A function that takes a component and returns a new enhanced component","A component with more features","The root component"],correctAnswer:1,explanation:"A HOC is a function that takes a component and returns a new component with additional props or behavior."},{id:"react-17",question:"What is React.Fragment used for?",options:["Creating code fragments","Grouping multiple elements without adding extra DOM nodes","Breaking components into pieces","Fragmenting state"],correctAnswer:1,explanation:"React.Fragment lets you group multiple children elements without adding extra nodes to the DOM."},{id:"react-18",question:"What is the `useReducer` hook?",options:["A hook to reduce component size","An alternative to useState for complex state logic using a reducer function","A hook to reduce re-renders","A performance optimization hook"],correctAnswer:1,explanation:"useReducer is an alternative to useState for managing complex state logic, using a reducer function with dispatch actions."},{id:"react-19",question:"What is prop drilling?",options:["A drilling animation with props","Passing props through multiple levels of components that don't need them","Validating props","Creating prop types"],correctAnswer:1,explanation:"Prop drilling is passing data through multiple intermediate components that don't need the data, just to reach a deeply nested component."},{id:"react-20",question:"What is React.lazy() used for?",options:["Making components slower","Dynamically importing components for code splitting","Delaying state updates","Creating lazy animations"],correctAnswer:1,explanation:"React.lazy() lets you dynamically import components, enabling code splitting to load components only when needed."},{id:"react-21",question:"What is the purpose of `Suspense` in React?",options:["Creating suspenseful animations","Displaying a fallback while waiting for lazy-loaded components or data","Suspending state updates","Pausing event handlers"],correctAnswer:1,explanation:"Suspense lets you display a fallback UI (like a loading spinner) while waiting for lazy-loaded components to load."},{id:"react-22",question:"What is a controlled component in React?",options:["A component with restricted access","A form element whose value is controlled by React state","A component that cannot be modified","A component with access control"],correctAnswer:1,explanation:"A controlled component is a form element whose value is driven by React state, with changes handled through event handlers."},{id:"react-23",question:"What is an uncontrolled component?",options:["A buggy component","A form element that manages its own state through the DOM","A component without props","A component without styling"],correctAnswer:1,explanation:"An uncontrolled component manages its own state internally through the DOM, typically accessed via refs."},{id:"react-24",question:"What is the React lifecycle method `componentDidMount` equivalent hook?",options:["useState","useEffect with an empty dependency array","useRef","useMemo"],correctAnswer:1,explanation:"useEffect with an empty dependency array [] runs once after the initial render, equivalent to componentDidMount."},{id:"react-25",question:"What is the purpose of `React.memo`?",options:["Creating memos","Memoizing a component to prevent unnecessary re-renders when props haven't changed","Storing data in memory","Creating documentation"],correctAnswer:1,explanation:"React.memo is a higher-order component that memoizes the component, skipping re-renders when props haven't changed."},{id:"react-26",question:"What is the children prop in React?",options:["Child components of a parent","Content passed between opening and closing tags of a component","Nested state variables","Sub-components"],correctAnswer:1,explanation:"The children prop contains the content passed between the opening and closing tags of a component."},{id:"react-27",question:"What is the purpose of `ErrorBoundary` in React?",options:["Preventing all errors","Catching JavaScript errors in child components and displaying fallback UI","Validating input","Handling network errors"],correctAnswer:1,explanation:"Error boundaries catch JavaScript errors anywhere in their child component tree and display a fallback UI instead of crashing."},{id:"react-28",question:"What is the difference between `useEffect` and `useLayoutEffect`?",options:["No difference","`useEffect` runs asynchronously after paint; `useLayoutEffect` runs synchronously before paint","`useLayoutEffect` is for CSS only","`useEffect` runs before render"],correctAnswer:1,explanation:"useEffect fires asynchronously after the browser paints, while useLayoutEffect fires synchronously before the browser paints."},{id:"react-29",question:"What is a custom hook in React?",options:["A built-in React hook",'A reusable function that starts with "use" and can use other hooks',"A hook from a third-party library","A hook for custom events"],correctAnswer:1,explanation:'Custom hooks are reusable functions prefixed with "use" that encapsulate logic using other hooks.'},{id:"react-30",question:"What is the `StrictMode` component used for?",options:["Enforcing coding standards","Highlighting potential problems and unsafe lifecycles during development","Making code stricter","Preventing errors in production"],correctAnswer:1,explanation:"StrictMode highlights potential problems in an application during development, like deprecated APIs and side effects."},{id:"react-31",question:"What is the difference between functional and class components?",options:["No difference","Functional components are simpler functions; class components use ES6 classes with lifecycle methods","Class components are faster","Functional components cannot have state"],correctAnswer:1,explanation:"Functional components are simple functions that use hooks for state/effects. Class components use ES6 classes with lifecycle methods."},{id:"react-32",question:"What is server-side rendering (SSR) in React?",options:["Running React on the server only","Rendering React components on the server and sending HTML to the client","A way to access server databases","Server monitoring with React"],correctAnswer:1,explanation:"SSR renders React components on the server, sending fully rendered HTML to the client for faster initial load and better SEO."},{id:"react-33",question:"What is React Context API used for?",options:["Creating contexts for testing","Sharing data across components without explicit prop passing","Managing server context","Creating execution contexts"],correctAnswer:1,explanation:"Context API provides a way to share data (like theme, user info) across the component tree without passing props at every level."},{id:"react-34",question:"What is the purpose of `React.createPortal`?",options:["Creating web portals","Rendering children into a DOM node outside the parent component hierarchy","Creating links between pages","Opening new browser windows"],correctAnswer:1,explanation:"createPortal lets you render children into a DOM node that exists outside the parent component's DOM hierarchy (e.g., modals)."},{id:"react-35",question:"What is reconciliation in React?",options:["Error recovery","The process of comparing the new Virtual DOM with the previous one to determine minimal DOM updates","Data synchronization","Component merging"],correctAnswer:1,explanation:"Reconciliation is React's diffing algorithm that compares the new Virtual DOM tree with the previous one to make minimal DOM updates."},{id:"react-36",question:"What does lifting state up mean?",options:["Moving state to a higher component","Moving shared state to the closest common ancestor of components that need it","Increasing state values","Moving state to the server"],correctAnswer:1,explanation:"Lifting state up means moving shared state to the closest common ancestor of components that need to share and synchronize that state."},{id:"react-37",question:"What is the purpose of `dangerouslySetInnerHTML`?",options:["To create dangerous code","To set HTML content directly from code, bypassing React's XSS protection","To inject CSS","To create security vulnerabilities"],correctAnswer:1,explanation:`dangerouslySetInnerHTML is React's replacement for innerHTML. It's named "dangerous" because it bypasses XSS protection.`},{id:"react-38",question:"What is the render prop pattern?",options:["A prop that renders CSS","A technique where a component receives a function prop that returns React elements","The render method in class components","A way to render lists"],correctAnswer:1,explanation:"Render props is a pattern where a component takes a function as a prop that returns React elements, enabling code reuse."},{id:"react-39",question:"What is Next.js?",options:["A CSS framework for React","A React framework for production with SSR, SSG, and routing built-in","A state management library","A testing framework for React"],correctAnswer:1,explanation:"Next.js is a React framework that provides server-side rendering, static site generation, routing, and other production features."},{id:"react-40",question:"What is the purpose of `useImperativeHandle`?",options:["Creating imperative code","Customizing the ref value exposed to parent components","Handling keyboard events","Managing form submissions"],correctAnswer:1,explanation:"useImperativeHandle customizes the instance value that is exposed to parent components when using ref with forwardRef."},{id:"react-41",question:"What is a Pure Component in React?",options:["A component without side effects","A component that only re-renders when props or state actually change (shallow comparison)","A component without children","A component with no styling"],correctAnswer:1,explanation:"PureComponent implements shouldComponentUpdate with a shallow prop and state comparison, preventing unnecessary re-renders."},{id:"react-42",question:"What is event handling in React different from regular HTML?",options:["No difference","React uses camelCase events and passes functions instead of strings","React doesn't support events","React uses uppercase events"],correctAnswer:1,explanation:"React uses camelCase naming (onClick vs onclick) and passes function references rather than strings as event handlers."},{id:"react-43",question:"What is the `useId` hook used for?",options:["Generating user IDs","Generating unique IDs for accessibility attributes","Creating database IDs","Managing user authentication"],correctAnswer:1,explanation:"useId generates unique IDs that are consistent between server and client, primarily for accessibility attributes like aria-labelledby."},{id:"react-44",question:"What is the purpose of `forwardRef`?",options:["Forwarding events","Passing a ref from a parent component to a child component's DOM element","Forwarding props","Forwarding state"],correctAnswer:1,explanation:"forwardRef lets a component pass a ref it receives to a child component, giving the parent access to a DOM element inside the child."},{id:"react-45",question:"What is code splitting in React?",options:["Splitting code into multiple files","Loading only the code needed for the current view to improve performance","Dividing code among team members","Splitting CSS from JavaScript"],correctAnswer:1,explanation:"Code splitting loads only the code needed for the current view, reducing the initial bundle size and improving load times."},{id:"react-46",question:"What state management libraries are commonly used with React?",options:["jQuery and Bootstrap","Redux, Zustand, MobX, and Recoil","Express and MongoDB","Webpack and Babel"],correctAnswer:1,explanation:"Popular state management libraries for React include Redux, Zustand, MobX, Recoil, and Jotai."},{id:"react-47",question:"What is the `useTransition` hook?",options:["Creating CSS transitions","Marking state updates as non-urgent to keep the UI responsive","Transitioning between routes","Animating components"],correctAnswer:1,explanation:"useTransition lets you mark state updates as non-urgent transitions, keeping the UI responsive during expensive renders."},{id:"react-48",question:"What is hydration in React?",options:["Adding water effects","Attaching event listeners and state to server-rendered HTML on the client","Loading data from an API","Optimizing performance"],correctAnswer:1,explanation:"Hydration is the process of attaching React's event listeners and state management to server-rendered HTML on the client side."},{id:"react-49",question:"What is the purpose of `React.cloneElement`?",options:["Deep cloning components","Cloning a React element and merging in new props","Creating component copies","Duplicating state"],correctAnswer:1,explanation:"React.cloneElement clones a React element and allows you to merge in new props, useful for passing additional props to children."},{id:"react-50",question:"What is the Compound Component pattern?",options:["Using multiple libraries together","A pattern where multiple components work together sharing implicit state","Combining CSS and JS","Creating complex animations"],corr
